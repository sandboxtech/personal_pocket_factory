exp-help=각 과학 팩 경험치의 [color=yellow]자릿수[/color]가 곧 레벨입니다. 1 이면 1, 10 이면 2, 100 이면 3.\n하나라도 안 모으면 그 항목은 [color=red]0[/color]. 레벨을 올리려면 전부 필요합니다.
