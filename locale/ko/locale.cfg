description=\n[color=acid]다이슨 링 계획[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]당신의 링[/font]\n한 사람당 하나씩 [color=acid]전용 링[/color]이 주어집니다. 들어갈 수 있는 건 자신뿐이지만 [color=red]자원은 하나도 없습니다[/color].\n경험치를 모으면 링이 넓어집니다.\n\n[img=item/linked-chest] [font=default-large-bold]연결 상자[/font]\n손으로 만든 나무 상자는 그대로 [color=acid]연결 상자[/color]가 됩니다. 바깥 행성에 두면 수거 지점이 되고, 넣은 물건은 링의 수령 상자로 바로 들어갑니다.\n광석을 짊어질 필요 없이 [color=yellow]집게 팔[/color]로 넣기만 하면 됩니다.\n\n[img=space-location/nauvis] [font=default-large-bold]바깥 세계는 초기화됩니다[/font]\n다섯 행성이 번갈아 초기화되며, 시간이 되면 [color=red]전부 사라집니다[/color]. [color=red]서버 전체의 연구된 기술도 무작위로 사라집니다[/color].\n계속 생산하고 연구해야 기술이 남습니다.\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]오래 접속하지 않으면[/font]\n링은 먼저 [color=acid]공용[/color]이 되어 누구나 드나들 수 있게 되고, 더 오래 두면 회수됩니다.\n하지만 [color=acid]경험치는 전혀 줄지 않습니다[/color]. 돌아오면 같은 너비로 다시 자랍니다.\n\n\n버전 0.2.0\n프로젝트 https://github.com/sandboxtech/personal_pocket_factory
