cmd-ring-delete-all-help=모든 플레이어의 링을 삭제합니다. 경험치에는 영향 없음. 인자 없이는 미리보기, confirm 을 붙여야 실행
cmd-ring-delete-all-preview=[color=yellow]미리보기[/color]: 링 [color=acid]__1__[/color] 개, 그중 [color=yellow]__2__[/color] 개는 주인이 접속 중 (링 안에 있는 사람은 한 번 죽고 소지품을 떨굽니다).\n건물과 연결 재고는 모두 사라지지만 [color=acid]경험치는 그대로[/color]이며, 다음에 들어갈 때 같은 너비로 자랍니다.\n실행하려면 [color=acid]/ring-delete-all confirm[/color]
