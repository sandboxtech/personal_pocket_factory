btn-travel-tip=[font=default-bold]이동[/font]\n자기 링으로 돌아가거나 채집하러 나갑니다.\n다섯 행성마다 초기화까지 남은 시간이 다릅니다. 나가기 전에 확인하세요.
btn-help-tip=[font=default-bold]플레이 방법[/font]\n이 서버를 어떻게 하는지 처음부터 설명합니다.
btn-status-tip=[font=default-bold]내 링[/font]\n체력, 변환, 경험치가 모두 여기 있습니다.\n체력은 초당 1 씩 오르고, 1 로 과학 팩 1 개를 경험치로 바꾸며, 경험치가 링 너비를 정합니다.
