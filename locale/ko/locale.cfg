console-label=서버 콘솔
help-title=플레이 방법
help-body=[font=default-bold]기본 흐름[/font]\n당신의 [color=acid]링은 초기화되지 않습니다[/color]. 여기 모은 것은 계속 남습니다.\n[color=yellow]바깥 다섯 행성은 주기적으로 비워집니다[/color]. 거기 둔 것도 함께 사라집니다.\n그래서 흐름은 이렇습니다: 행성에서 채집 → 연결 상자로 링에 보내기 → 링에서 가공하고 경험치 모으기.\n경험치가 링을 넓히며, [color=acid]영구적인 성장은 이것뿐[/color]입니다.\n\n[font=default-bold]당신의 링[/font]\n들어갈 수 있는 건 자신뿐. [color=red]자원은 하나도 없고[/color] 전부 밖에서 옮겨 와야 합니다.\n\n[font=default-bold]열두 가지 경험치[/font]\n12 종 과학 팩이 따로 기록되고, 각각의 [color=yellow]자릿수[/color]를 12 개 더한 것이 레벨입니다.\n1 을 모으면 1, 이후 10 배마다 1 씩 늘어납니다.\n하나도 안 모은 종류는 [color=red]0[/color]. 그래서 다섯 행성을 모두 돌아야 합니다.\n\n[font=default-bold]연결 상자[/font]\n[color=yellow]손으로 나무 상자를 만들면[/color] 나오는 건 [color=acid]연결 상자[/color]입니다 (조립 기계가 만든 나무 상자도 설치할 때 바뀝니다).\n바깥에 두면 [color=acid]수거 지점[/color]이 되고, 넣은 물건은 링의 수령 상자로 직행합니다.\n[color=red]우주 전체에 하나만[/color] 둘 수 있습니다. 새로 놓으면 이전 것이 사라지니 어디에 둘지가 중요한 선택입니다.\n상자는 [color=red]누구도 손으로 열 수 없습니다[/color]. 넣고 빼는 건 전부 집게 팔로.\n\n[font=default-bold]자동 변환[/font]\n수령 상자의 과학 팩은 [color=acid]주기적으로 알아서 경험치가 됩니다[/color]. 접속하지 않아도 진행됩니다.\n연구에 쓰고 싶다면 집게 팔로 미리 빼내세요. [color=yellow]자동 변환과의 경쟁[/color]도 이 게임의 일부입니다.\n\n[font=default-bold]바깥 다섯 행성[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] 가 번갈아 초기화됩니다.\n차례가 온 행성은 [color=red]전부 지워지며[/color], 당신이 둔 것도 마찬가지입니다.
help-body-veteran=[font=default-bold]기술 유출[/font]\n연구된 기술이 때때로 취소됩니다. 트리 안쪽일수록 빨리 새어 나갑니다. 레벨식 연구는 0 이 되지 않고 한 단계만 내려갑니다.\n계속 생산하고 연구해서 잃은 만큼 메우는 수밖에 없습니다.\n\n[font=default-bold]체력[/font]\n저절로 오르고 접속하지 않아도 오르며 상한에서 멈춥니다. 경험치 변환에는 체력이 듭니다. 필요한 건 그것뿐입니다.\n\n[font=default-bold]오래 접속하지 않으면[/font]\n링은 먼저 [color=acid]공용[/color]이 되어 누구나 들어와 뜯고 비울 수 있게 됩니다.\n더 오래 두면 회수됩니다.\n하지만 [color=acid]경험치는 전혀 줄지 않습니다[/color]. 돌아오면 다시 자랍니다.
help-body-detail=[font=default-bold]구체적인 수치[/font]\n행성 초기화 주기: [planet=nauvis] __1__ 분, [planet=vulcanus] __2__ 분, [planet=gleba] __3__ 분, [planet=fulgora] __4__ 분, [planet=aquilo] __5__ 분.\n어떤 기술이 취소될 확률(%)은 그 기술에 필요한 과학 팩 종류 수 × __6__ 정도입니다.\n__7__ 시간 접속하지 않으면 링이 공용이 되어 누구나 들어올 수 있고, __8__ 시간이면 회수되지만 경험치는 사라지지 않습니다.
btn-overview-tip=[font=default-bold]서버[/font]\n모두의 링과 우주선 목록.\n누군가 충분히 오래 자리를 비우면 그 링에 들어갈 수 있습니다. 자기 배도 여기서 만듭니다.
