claim-pending=수령 가능 [color=acid]__1__[/color]/__2__
claim-pending-plain=수령 가능 [color=acid]__1__[/color]
claim-do=받기
claim-do-tip=모아둔 체력을 저장고로 옮깁니다.\n받지 않아도 계속 쌓이지만 가득 차면 멈추니 잊지 말고 받으세요.
