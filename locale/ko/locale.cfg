ring-public=[color=yellow]__1__[/color] 이(가) 너무 오래 접속하지 않아 링이 [color=acid]공용[/color]이 되었습니다. 누구나 들어갈 수 있습니다
ring-deleted=[color=red]__1__[/color] 의 링이 장기 미접속으로 회수되었습니다 ([color=acid]경험치는 그대로[/color])
dropoff-replaced=[color=yellow]__1__ 에 두었던 수거 지점을 회수했습니다[/color]. 동시에 __2__ 개까지 둘 수 있어, 가장 오래된 것을 인벤토리로 돌려주었습니다.
