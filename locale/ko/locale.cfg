cmd-no-ring=그 플레이어에게는 삭제할 링이 없습니다
cmd-ring-delete-help=지정한 플레이어의 링을 삭제합니다. 경험치에는 영향이 없고 다음에 들어갈 때 같은 너비로 다시 자랍니다
cmd-ring-delete-usage=사용법: /ring-delete <플레이어 이름>
cmd-ring-deleted=[color=acid]__1__ 의 링을 삭제했습니다[/color]
cmd-ring-delete-all-help=모든 플레이어의 링을 삭제합니다. 경험치에는 영향 없음. 인자 없이는 미리보기, confirm 을 붙여야 실행
cmd-ring-delete-all-preview=[color=yellow]미리보기[/color]: 링 [color=acid]__1__[/color] 개, 그중 [color=yellow]__2__[/color] 개는 주인이 접속 중 (링 안에 있는 사람은 한 번 죽고 소지품을 떨굽니다).\n건물과 연결 재고는 모두 사라지지만 [color=acid]경험치는 그대로[/color]이며, 다음에 들어갈 때 같은 너비로 자랍니다.\n실행하려면 [color=acid]/ring-delete-all confirm[/color]
cmd-ring-delete-all-none=지금은 링이 하나도 없습니다
cmd-ring-delete-all-done=[color=red]__2__ 이(가) 서버 전체 링 __1__ 개를 초기화했습니다[/color] ([color=acid]경험치는 무사[/color]. 링 버튼을 누르면 다시 자랍니다)
cmd-repair-help=복구: 빠진 설정 기본값 채우기, 권한 그룹 재생성, 없는 월드 생성, 모든 링 재정렬. 멱등이라 언제든 실행할 수 있습니다
cmd-repair-done=[color=acid]복구 완료[/color]: 링 [color=yellow]__1__[/color] 개를 재정렬하고 행성 [color=yellow]__2__[/color] 개의 맵 생성 설정을 복원했습니다.\n설정 기본값, 권한 그룹, 성도 해금, 우주 플랫폼 버튼 잠금도 모두 다시 적용했습니다.\n[color=yellow]자원 정리는 각 행성의 다음 초기화 이후에 보입니다[/color] - 맵 생성 설정은 앞으로 생성될 청크에만 적용됩니다.
cmd-repair-broadcast=[color=acid]__1__ 님이 복구를 실행했습니다[/color]. 링에 수거 상자가 생기거나 표시 이름이 바뀌었다면 그 때문입니다.
cmd-reset-config-help=모든 조정 가능 설정을 기본값으로 되돌립니다. 플레이어 진행도는 그대로입니다. confirm 없이 실행하면 미리보기만 표시합니다
cmd-reset-config-preview=[color=yellow]미리보기[/color]: 조정 가능 설정은 모두 [color=acid]__2__[/color] 개이며, 그중 [color=yellow]__1__[/color] 개가 기본값과 다릅니다.\n[color=acid]플레이어 진행도(경험치, 체력, 링, 우주선, 일정)는 전혀 건드리지 않습니다[/color].\n실행하려면 [color=acid]/pw-reset-config confirm[/color] 을 입력하세요.
cmd-reset-config-done=[color=yellow]__2__ 님이 설정 __1__ 개를 모두 기본값으로 되돌렸습니다[/color] (플레이어 진행도는 영향 없음)
cmd-export-help=모든 플레이어의 경험치와 체력을 script-output 폴더로 내보냅니다
cmd-export-none=아직 내보낼 플레이어 진행도가 없습니다
cmd-export-done=[color=acid]__1__ 명의 진행도를 내보냈습니다[/color]. script-output 폴더에 다음 두 파일을 만들었습니다:\n[color=yellow]__2__[/color]  사람이 보거나 외부 도구에서 쓰는 용도\n[color=yellow]__3__[/color]  이쪽이 가져오기 파일입니다. control.lua 와 같은 scenario 폴더에 복사만 하면 되고 이름은 바꾸지 않아도 됩니다
cmd-import-help=scenario 폴더의 exp_import.lua 에서 경험치와 체력을 복원합니다. confirm 없이 실행하면 미리보기만 표시합니다
cmd-import-none=사용할 수 있는 가져오기 파일을 읽지 못했습니다. [color=yellow]exp_import.lua[/color] 를 control.lua 와 같은 scenario 폴더에 복사하고 [color=acid]/c game.reload_script()[/color] 를 실행한 뒤 다시 시도하세요. 엔진은 스크립트를 불러오는 순간에만 디스크를 읽기 때문에, 다시 불러오지 않으면 새 파일을 볼 수 없습니다.
cmd-import-preview=[color=yellow]미리보기[/color]: 파일에 [color=acid]__1__[/color] 명이 있고 그중 [color=acid]__2__[/color] 명은 이 세이브가 아는 이름입니다(몰라도 문제없습니다. 접속하면 자동으로 연결됩니다).\n알 수 없거나 잘못된 항목 [color=yellow]__3__[/color] 개를 무시했습니다.\n[color=red]병합이 아니라 덮어쓰기입니다[/color]: 해당 플레이어의 경험치와 체력이 통째로 교체되며, 파일에 없는 플레이어는 영향을 받지 않습니다.\n실행하려면 [color=acid]/pw-import confirm[/color] 을 입력하세요.
cmd-import-done=[color=acid]__2__ 님이 __1__ 명의 진행도를 가져왔습니다[/color] (경험치와 체력을 스냅샷대로 복원)
cmd-ring-deleted-broadcast=[color=acid]__2__[/color] 이(가) [color=yellow]__1__[/color] 의 링을 삭제했습니다
console-label=서버 콘솔
help-title=플레이 방법
help-body=[font=default-bold]당신의 링[/font]\n한 사람당 하나, 들어갈 수 있는 건 자신뿐입니다. [color=acid]행성과 함께 지워지지 않으며[/color], 가끔이라도 접속하면 계속 당신 것입니다. 오래 접속하지 않을 때만 잃습니다. [color=red]광석은 하나도 없고[/color] 중앙에 작은 얕은 물웅덩이가 있습니다.\n\n[font=default-bold]12 가지 경험치[/font]\n12 종 과학 팩은 따로 기록됩니다. 각 경험치의 [color=yellow]자릿수[/color]가 그 레벨이며, 12 항을 더한 값이 총레벨입니다.\n링 너비 =（총레벨 + 2）× 32 타일. 배 너비 =（총레벨 + 4）× 16 타일.\n\n[font=default-bold]연결 상자[/font]\n손으로 만든 나무 상자는 그대로 [color=acid]연결 상자[/color]가 됩니다. 링 밖에 두면 수거 지점이 되어 내용물이 링의 수령 상자로 직행합니다.\n[color=red]우주 전체에서 동시에 __1__ 개까지[/color] 둘 수 있으며, 그보다 더 놓으면 가장 오래된 것이 인벤토리로 돌아옵니다.\n상자는 [color=red]손으로 열 수 없고[/color] 투입기로만 넣고 뺍니다.\n\n[font=default-bold]공용 세계[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] 는 각자의 초기화 주기를 가집니다. 시간이 되면 행성 전체가 [color=red]지워집니다[/color].
help-body-veteran=[font=default-bold]체력과 변환[/font]\n체력은 초당 1 씩 회복되며 오프라인에도 늘고 상한에서 멈춥니다. 체력 1 로 과학 팩 1 개를 변환합니다.\n수동 변환은 「내 링」에서 인벤토리를 대상으로, 자동 변환은 1 분마다 수령 상자를 대상으로 이루어집니다. 둘은 같은 체력을 씁니다.\n\n[font=default-bold]기술 유출[/font]\n연구된 기술이 주기적으로 취소되며, 확률은 그 기술에 필요한 팩 종류 수에 따라 올라갑니다. 레벨식 연구는 0 이 되지 않고 한 단계 내려갑니다.\n\n[font=default-bold]장기 미접속[/font]\n일정 기간 접속하지 않으면 링이 공용이 되어 누구나 들어와 뜯을 수 있고, 더 지나면 회수됩니다. 경험치는 영향을 받지 않습니다.
help-body-detail=[font=default-bold]구체적인 수치[/font]\n행성 초기화 주기: [planet=nauvis] __1__ 분, [planet=vulcanus] __2__ 분, [planet=gleba] __3__ 분, [planet=fulgora] __4__ 분, [planet=aquilo] __5__ 분.\n누수 판정은 매번 0~__6__ 사이의 계수를 하나 뽑습니다. 그 회차에 기술이 취소될 확률(%)은 필요한 과학 팩 종류 수 × 그 계수입니다.\n__7__ 시간 접속하지 않으면 링이 공용이 되어 누구나 들어올 수 있고, __8__ 시간이면 회수되지만 경험치는 사라지지 않습니다. 이 두 기준은 누적 플레이 시간에 따라 늘어나며, 위 수치는 숙련자 상한입니다. 갓 시작했다면 최소 __9__ 시간이면 공용, __10__ 시간이면 삭제됩니다.
btn-overview-tip=[font=default-bold]서버[/font]\n모두의 링과 우주선 목록.\n누군가 충분히 오래 자리를 비우면 그 링에 들어갈 수 있습니다. 자기 배도 여기서 만듭니다.
