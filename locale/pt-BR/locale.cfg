console-label=console do servidor
help-title=Como jogar
help-body=[font=default-bold]Seu anel[/font]\nUm por jogador, só você entra, e ele [color=acid]nunca é reiniciado[/color]. Não tem [color=red]nenhum minério[/color] e há um pequeno lago raso no centro.\n\n[font=default-bold]Doze tipos de experiência[/font]\nOs 12 frascos são contados separadamente. Um frasco rende tantos níveis quantos [color=yellow]dígitos[/color] tiver sua experiência, e os 12 somam seu nível total.\nLargura do anel = (nível total + 2) x 32 blocos. Largura da nave = (nível total + 4) x 16 blocos.\n\n[font=default-bold]Baús vinculados[/font]\nUm baú de madeira feito à mão já sai como [color=acid]baú vinculado[/color]. Colocado fora do seu anel vira ponto de coleta, e o conteúdo vai direto para os baús de recebimento do anel.\n[color=red]Só pode existir um no universo inteiro[/color]: ao colocar um novo, o antigo volta para o seu inventário.\nOs baús [color=red]não abrem na mão[/color]; tudo entra e sai por braços mecânicos.\n\n[font=default-bold]Mundos públicos[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] têm cada um seu próprio ciclo de reinício. Ao fim dele, o planeta inteiro é [color=red]apagado[/color].
help-body-veteran=[font=default-bold]Energia e conversão[/font]\nA energia recupera 1 por segundo, inclusive offline, e para no teto. 1 de energia converte 1 frasco.\nA conversão manual fica em «Meu anel» e usa o seu inventário; a automática passa uma vez por minuto e usa os baús de recebimento. As duas gastam a mesma reserva.\n\n[font=default-bold]Vazamento tecnológico[/font]\nTecnologias pesquisadas são anuladas periodicamente; a chance sobe com o número de tipos de frasco que a tecnologia exige. Pesquisas por níveis caem um nível em vez de zerar.\n\n[font=default-bold]Ausência prolongada[/font]\nFicando fora tempo suficiente, seu anel vira público, aberto para entrar e desmontar; mais tempo ainda e ele é recolhido. A experiência não é afetada.
help-body-detail=[font=default-bold]Os números exatos[/font]\nCiclos de reinício: [planet=nauvis] __1__ min, [planet=vulcanus] __2__ min, [planet=gleba] __3__ min, [planet=fulgora] __4__ min, [planet=aquilo] __5__ min.\nA chance de uma tecnologia ser anulada, em porcentagem, é cerca do número de tipos de frasco que ela exige × __6__.\nDepois de __7__ h offline seu anel vira público e fica aberto a todos; com __8__ h ele é recolhido, sem nunca perder a experiência.
btn-overview-tip=[font=default-bold]Servidor[/font]\nOs anéis e as naves de todo mundo.\nQuando alguém fica fora tempo suficiente, dá para entrar no anel dele. Sua própria nave também se constrói aqui.
