description=\n[color=acid]Projeto Anel de Dyson[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]Seu anel[/font]\nCada jogador ganha um [color=acid]anel próprio[/color]: só você entra, mas [color=red]não há nenhum recurso lá[/color].\nJunte experiência e o anel fica mais largo.\n\n[img=item/linked-chest] [font=default-large-bold]Baús vinculados[/font]\nUm baú de madeira feito à mão já sai como [color=acid]baú vinculado[/color]. Coloque-o lá fora como ponto de coleta e tudo que entrar vai direto para os baús de recebimento do seu anel.\nNão precisa mais carregar minério: os [color=yellow]braços mecânicos[/color] fazem isso.\n\n[img=space-location/nauvis] [font=default-large-bold]Os mundos externos são reiniciados[/font]\nOs cinco planetas se revezam: na hora marcada [color=red]tudo lá some[/color], e o servidor [color=red]perde tecnologias já pesquisadas ao acaso[/color].\nSó quem continua produzindo e pesquisando mantém as tecnologias.\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]Ficar muito tempo fora[/font]\nSeu anel primeiro vira [color=acid]público[/color] e fica aberto a todos; se demorar mais ainda, acaba sendo recolhido.\nMas sua [color=acid]experiência não se perde[/color]: ao voltar, o anel cresce com a mesma largura.\n\n\nVersão 0.2.0\nProjeto https://github.com/sandboxtech/personal_pocket_factory\nGrupo QQ 293280221
