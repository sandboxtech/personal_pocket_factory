console-label=console do servidor
help-title=Como jogar
help-body=[font=default-bold]Seu anel[/font]\nUm por jogador, só você entra. Ele [color=acid]não é apagado junto com os planetas[/color] e continua seu enquanto você aparecer de vez em quando: só uma ausência longa custa ele. Não tem [color=red]nenhum minério[/color] e há um pequeno lago raso no centro, com espaço para bombas hidráulicas nas quatro margens.\nAqui é [color=acid]sempre dia[/color], então os painéis solares atravessam a noite sem acumuladores.\n\n[font=default-bold]Quando você morre[/font]\nOnde quer que caia, você renasce no seu próprio anel. [color=red]O cadáver e tudo o que estava com você ficam onde morreu[/color] e somem quando aquele planeta reinicia.\nUm kit sai [color=yellow]no máximo uma vez a cada __2__ h[/color] (armadura modular, roboport pessoal, painéis solares, robôs construtores): morrer duas vezes seguidas não rende um segundo.\n\n[font=default-bold]Doze tipos de experiência[/font]\nOs 12 frascos são contados separadamente. Um frasco rende tantos níveis quantos [color=yellow]dígitos[/color] tiver sua experiência, e os 12 somam seu nível total.\nLargura do anel = (nível total + 4) x 16 blocos. Largura da nave = (nível total + 4) x 16 blocos.\n\n[font=default-bold]Baús vinculados[/font]\nUm baú de madeira feito à mão já sai como [color=acid]baú vinculado[/color]. Colocado fora do seu anel vira ponto de coleta, e o conteúdo vai direto para os baús de recebimento do anel.\n[color=red]No máximo __1__ ao mesmo tempo[/color] no universo inteiro: ao colocar um a mais, o mais antigo volta para o seu inventário.\nOs baús [color=red]não abrem na mão[/color]; tudo entra e sai por braços mecânicos.\n\n[font=default-bold]Mundos públicos[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] têm cada um seu próprio ciclo de reinício. Ao fim dele, o planeta inteiro é [color=red]apagado[/color].\nSe você ainda estiver lá embaixo, recebe um aviso antes: é a deixa para encher um ponto de coleta e sair.
help-body-veteran=[font=default-bold]Energia e conversão[/font]\nA energia recupera 1 por segundo, inclusive offline, e para no teto. 1 de energia converte 1 frasco.\nA conversão manual fica em «Meu anel» e usa o seu inventário; a automática usa os baús de recebimento, a cada __1__ min enquanto você está online e a cada __2__ min enquanto está fora. As duas gastam a mesma reserva.\n\n[font=default-bold]Vazamento tecnológico[/font]\nTecnologias pesquisadas são anuladas periodicamente; a chance sobe com o número de tipos de frasco que a tecnologia exige. Pesquisas por níveis caem um nível em vez de zerar.\n\n[font=default-bold]Ausência prolongada[/font]\nFicando fora tempo suficiente, seu anel vira público, aberto para entrar e desmontar; mais tempo ainda e ele é recolhido. A experiência não é afetada.
help-body-detail=[font=default-bold]Os números exatos[/font]\nCiclos de reinício: [planet=nauvis] __1__ min, [planet=vulcanus] __2__ min, [planet=gleba] __3__ min, [planet=fulgora] __4__ min, [planet=aquilo] __5__ min.\nCada rodada sorteia um coeficiente entre 0 e __6__; a chance de uma tecnologia ser anulada nessa rodada, em porcentagem, é o número de tipos de frasco que ela exige × esse coeficiente.\nDepois de __7__ h offline seu anel vira público e fica aberto a todos; com __8__ h ele é recolhido, sem nunca perder a experiência. Os dois limiares crescem com seu tempo total de jogo; os números acima são o teto de veterano. Para um jogador novo, são no mínimo __9__ h até virar público e __10__ h até a exclusão.\nAvisos antes do apagamento: __11__ min antes.
btn-overview-tip=[font=default-bold]Servidor[/font]\nOs anéis e as naves de todo mundo.\nQuando alguém fica fora tempo suficiente, dá para entrar no anel dele. Sua própria nave também se constrói aqui.
