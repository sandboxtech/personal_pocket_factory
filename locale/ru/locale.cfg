help-body-summary=[font=default-bold]Основной цикл[/font]\nСобирайте ресурсы на общих планетах и ставьте деревянные сундуки как связанные пункты отправки, чтобы доставлять груз домой.\nОбменивайте исследовательские пакеты на опыт; чем больше опыта, тем крупнее становятся ваше кольцо и корабль.\nНа кольце нет руды, но там всегда день, а солнечная энергия получает бонус [color=yellow]+900%[/color].\nОбщие планеты регулярно сбрасываются, закрываются на два часа, а затем открываются снова. Каждый сброс полностью очищает планету.
help-body=[font=default-bold]Ваше кольцо[/font]\nПо одному на игрока, войти можете только вы. Оно [color=acid]не очищается вместе с планетами[/color] и остаётся вашим, пока вы хоть изредка заходите, — потерять его можно только надолго пропав. Руды в нём [color=red]нет вообще[/color], в центре есть небольшое мелководье, и прибрежный насос можно поставить с любой из четырёх сторон.\nЗдесь [color=acid]всегда день[/color], так что солнечные панели тянут круглые сутки и аккумуляторы не нужны.\n\n[font=default-bold]Если вы погибли[/font]\nГде бы вы ни погибли, возрождаетесь на своём кольце. [color=red]Труп и всё, что было при вас, остаются на месте гибели[/color] и исчезают вместе со сбросом той планеты.\nПосле возрождения можно потратить [color=yellow]__2__ единиц сил[/color] и получить стартовый комплект (модульная броня, персональная дронстанция, солнечные панели, строительные дроны). Если сил недостаточно, комплект не выдаётся.\n\n[font=default-bold]Двенадцать видов опыта[/font]\n12 видов колб учитываются раздельно. Вклад вида равен [color=yellow]числу разрядов[/color] его опыта, сумма всех 12 даёт общий уровень.\nШирина кольца = (уровень + 4) x 16 тайла. Ширина корабля = (уровень + 4) x 16 тайлов.\n\n[font=default-bold]Связанные сундуки[/font]\nСундук, скрафченный вручную, сразу выходит [color=acid]связанным[/color]. Поставленный где угодно за пределами кольца, он становится пунктом сбора, а содержимое уходит прямо в приёмные сундуки кольца.\n[color=red]Не больше __1__ одновременно[/color] на всю вселенную: поставите ещё один — самый старый вернётся в инвентарь.\nСундуки [color=red]нельзя открыть руками[/color], загрузка и выгрузка только манипуляторами.\n\n[font=default-bold]Общие миры[/font]\nУ [color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] свой период сброса у каждого. По его истечении планета [color=red]очищается целиком[/color].\nПеред этим тем, кто ещё на планете, приходит предупреждение: увидели — грузите связанный сундук и уходите.
help-body-veteran=[font=default-bold]Силы и обмен[/font]\nСилы восстанавливаются по 1 в секунду, в том числе офлайн, и останавливаются на пределе. 1 единица сил обменивает 1 колбу.\nРучной обмен находится в «Моём кольце» и берёт из инвентаря; автоматический берёт из приёмных сундуков раз в __1__ мин, пока вы в игре. Оба тратят один и тот же запас.\n\n[font=default-bold]Утечка технологий[/font]\nИзученные технологии периодически отменяются; вероятность растёт с числом видов колб, которые технология требует. Уровневые исследования откатываются на один уровень, а не обнуляются.\n\n[font=default-bold]Долгое отсутствие[/font]\nЕсли не заходить достаточно долго, кольцо становится общим и открывается для входа и разбора; ещё дольше — и его сносят. Опыт при этом не затрагивается.
help-body-detail=[font=default-bold]Точные значения[/font]\nПериоды сброса планет: [planet=nauvis] __1__ мин., [planet=vulcanus] __2__ мин., [planet=gleba] __3__ мин., [planet=fulgora] __4__ мин., [planet=aquilo] __5__ мин.\nКаждый раунд берётся один случайный коэффициент от 0 до __6__; вероятность отмены технологии в этом раунде в процентах равна числу нужных ей видов колб × этот коэффициент.\nПосле __7__ ч офлайна кольцо становится общим и открыто для всех, после __8__ ч его сносят, но опыт при этом не теряется. Оба порога растут вместе с вашим общим временем игры, выше указан предел для ветеранов. У новичка это минимум __9__ ч до общего доступа и __10__ ч до удаления.\nПредупреждения перед очисткой: за __11__ мин.
btn-overview-tip=[font=default-bold]Сервер[/font]\nКольца и корабли всех игроков.\nКогда кого-то нет достаточно долго, в его кольцо можно зайти. Свой корабль строится тоже здесь.
