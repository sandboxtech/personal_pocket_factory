cmd-import-preview=[color=yellow]Предпросмотр[/color]: в файле [color=acid]__1__[/color] игроков, из них [color=acid]__2__[/color] знакомы этому сохранению (незнакомые имена — не ошибка, они сойдутся, когда игрок зайдёт).\nПропущено полей с неизвестными или недопустимыми значениями: [color=yellow]__3__[/color].\n[color=red]Это перезапись, а не слияние[/color]: опыт и выносливость этих игроков заменяются целиком, а игроки, не указанные в файле, не затрагиваются.\nДля выполнения введите [color=acid]/pw-import confirm[/color]
