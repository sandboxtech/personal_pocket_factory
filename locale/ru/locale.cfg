console-label=консоль сервера
help-title=Как играть
help-body=[font=default-bold]Основной цикл[/font]\nВаше [color=acid]кольцо не сбрасывается[/color]: всё накопленное здесь остаётся навсегда.\n[color=yellow]Пять внешних планет время от времени очищаются[/color], и оставленное там исчезает вместе с ними.\nОтсюда и порядок: добываете на планете, отправляете добычу в кольцо связанным сундуком, а дома перерабатываете и копите опыт.\nОпыт расширяет кольцо, и это [color=acid]единственный постоянный рост[/color] в игре.\n\n[font=default-bold]Ваше кольцо[/font]\nУчасток, куда можете войти только вы. [color=red]Ресурсов нет совсем[/color], всё привозится извне.\n\n[font=default-bold]Двенадцать видов опыта[/font]\n12 видов колб учитываются раздельно: берётся [color=yellow]число разрядов[/color] каждого, и все 12 складываются в уровень.\n1 очко даёт 1 уровень, дальше каждое десятикратное увеличение добавляет ещё один.\nВид, которого нет вовсе, даёт [color=red]0[/color], поэтому объехать придётся все пять планет.\n\n[font=default-bold]Связанные сундуки[/font]\nЕсли [color=yellow]скрафтить деревянный сундук вручную[/color], получится [color=acid]связанный сундук[/color] (сделанные сборочным автоматом превращаются при установке).\nПоставьте его снаружи как [color=acid]пункт сбора[/color], и всё положенное уйдёт прямо в приёмные сундуки кольца.\n[color=red]На всю вселенную он только один[/color]: поставите новый, старый исчезнет, так что место выбирайте осознанно.\nСундук [color=red]никто не может открыть руками[/color], загрузка и выгрузка только манипуляторами.\n\n[font=default-bold]Автоматический обмен[/font]\nКолбы в приёмных сундуках [color=acid]сами превращаются в опыт[/color] по таймеру, даже пока вы офлайн.\nХотите оставить их для исследований, вынимайте манипуляторами заранее. [color=yellow]Гонка с автообменом[/color] и есть часть игры.\n\n[font=default-bold]Пять внешних планет[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] сбрасываются по очереди.\nЧья очередь, с той [color=red]исчезает всё[/color], включая оставленное вами.
help-body-veteran=[font=default-bold]Утечка технологий[/font]\nИзученные технологии время от времени отменяются, и чем глубже по дереву, тем быстрее. Уровневые исследования не обнуляются, а откатываются на один уровень.\nОстаётся только производить и исследовать, восполняя потери.\n\n[font=default-bold]Силы[/font]\nРастут сами, даже офлайн, и останавливаются на пределе. Обмен на опыт стоит сил, это единственный пропуск.\n\n[font=default-bold]Долгое отсутствие[/font]\nСначала кольцо становится [color=acid]общим[/color]: любой может войти, разобрать и вынести.\nЕщё дольше, и его сносят.\nНо [color=acid]опыт не теряется[/color]: вернётесь, и кольцо вырастет заново.
help-body-detail=[font=default-bold]Точные значения[/font]\nПериоды сброса планет: [planet=nauvis] __1__ мин., [planet=vulcanus] __2__ мин., [planet=gleba] __3__ мин., [planet=fulgora] __4__ мин., [planet=aquilo] __5__ мин.\nВероятность отмены технологии в процентах примерно равна числу нужных ей видов колб × __6__.\nПосле __7__ ч офлайна кольцо становится общим и открыто для всех, после __8__ ч его сносят, но опыт при этом не теряется.
btn-overview-tip=[font=default-bold]Сервер[/font]\nКольца и корабли всех игроков.\nКогда кого-то нет достаточно долго, в его кольцо можно зайти. Свой корабль строится тоже здесь.
