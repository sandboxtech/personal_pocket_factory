description=\n[color=acid]Проект «Кольцо Дайсона»[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]Ваше кольцо[/font]\nУ каждого своё [color=acid]личное кольцо[/color]: войти можете только вы, но [color=red]ресурсов там нет вообще[/color].\nКопите опыт, и кольцо становится шире.\n\n[img=item/linked-chest] [font=default-large-bold]Связанные сундуки[/font]\nСундук, скрафченный вручную, сразу получается [color=acid]связанным[/color]. Поставьте его на планете, и всё, что туда попадёт, уйдёт прямо в приёмные сундуки кольца.\nРуду не надо таскать на себе, достаточно [color=yellow]манипуляторов[/color].\n\n[img=space-location/nauvis] [font=default-large-bold]Внешние миры сбрасываются[/font]\nПять планет сбрасываются по очереди: в свой час [color=red]с планеты исчезает всё[/color], а у сервера [color=red]случайно пропадают изученные технологии[/color].\nЧтобы технологии оставались, надо не переставать производить и исследовать.\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]Долгое отсутствие[/font]\nСначала кольцо становится [color=acid]общим[/color] и открывается для всех, а если не заходить ещё дольше, его сносят.\nНо [color=acid]опыт не теряется[/color]: вернётесь, и кольцо вырастет той же ширины.\n\n\nВерсия 0.2.0\nПроект https://github.com/sandboxtech/personal_pocket_factory
scenario-name=[color=acid]Проект «Кольцо Дайсона»[/color]

