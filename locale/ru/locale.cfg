cmd-repair-help=Починка: дозаполнить недостающие значения настроек, пересоздать группу прав, создать недостающие миры, выровнять все кольца. Идемпотентно, можно запускать в любой момент
cmd-repair-done=[color=acid]Починка выполнена[/color]: выровнено колец — [color=yellow]__1__[/color], восстановлены настройки генерации у планет — [color=yellow]__2__[/color].\nЗначения настроек, группа прав, разблокировка карты и блокировка кнопки платформы применены заново.\n[color=yellow]Очистка ресурсов будет видна только после следующего сброса каждой планеты[/color] — настройки генерации влияют лишь на новые чанки.
