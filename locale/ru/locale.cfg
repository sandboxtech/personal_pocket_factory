cfg-ring-width=Ring band width in tiles; also the map generation hard bound
cfg-ring-concrete-width=Width of the buildable middle band; the rest is open space
cfg-ring-base-half-length=Minimum half-length in tiles; minimum length is twice this
cfg-ring-length-per-level=Total ring length gained per level, in tiles
cfg-ring-public-hours=Через сколько часов офлайна кольцо становится общим (предел для ветеранов)
cfg-ring-delete-multiple=Во сколько раз порог удаления больше порога перехода в общий доступ (3 — это 3 ч → 9 ч, 30 ч → 90 ч)
cfg-ring-min-hours=Нижняя граница обоих порогов после масштабирования по времени игры
cfg-ring-hide-private=Скрывать ли личные кольца из списка поверхностей в режиме удалённого просмотра; общие кольца видны всегда. При false личные кольца тоже можно смотреть и разбирать удалённо
cfg-public-size=Сторона общей планеты в тайлах (граница карты)
cfg-dropoff-limit=Сколько пунктов сбора игрок может держать одновременно на всю вселенную; лишний самый старый возвращается в инвентарь
cfg-world-climate-swing=Разброс климата между кругами (только Nauvis). Смещает всю планету к влажному или сухому и к красной пустыне; 0 — климат всегда одинаковый
cfg-world-terrain-scale=Размер участков рельефа (только Nauvis). Чем меньше, тем крупнее участки. Это же частота воды, поэтому озёр станет меньше, но они станут больше
cfg-world-reset-offset-minutes=На сколько минут расходятся первые расписания соседних планет
cfg-ship-life-hours=Срок жизни корабля в часах, потом он уничтожается
cfg-ship-height=Граница высоты поверхности корабля
cfg-ship-home-planet=Вокруг какой планеты по умолчанию летает новый корабль
cfg-ship-lock-native-creation=Запрещает создавать корабли в обход интерфейса и блокирует обычное удаление платформ
cfg-cycle-minutes=Период повторяющихся задач в минутах
cfg-cycle-phase-minutes=На сколько минут расходятся фазы повторяющихся задач
cfg-cycle-base-offset-minutes=Общее смещение задач, чтобы не совпадать со сбросами планет
cfg-hud-refresh-ticks=Интервал автообновления интерфейса в игровых тиках
cfg-tech-loss-k-max=Верхняя граница коэффициента утечки: каждый раунд берётся число от 0 до этого значения, вероятность% = число видов колб × это число
cfg-detail-hours=Порог ветерана в часах игры; открывает подробные числа
cfg-block-blueprint-library=Отключать ли библиотеку чертежей
cfg-debug=Отладочные сообщения
cfg-world-reset-minutes=Период сброса по планетам в минутах, ключ — имя планеты
cfg-world-warn-minutes=За сколько минут до сброса предупреждать тех, кто ещё на планете (массив, можно несколько порогов)
cfg-quality-exp=Множитель опыта по качеству
cfg-starter-items=Стартовый набор новых игроков. Заменяйте таблицу целиком; {} означает «ничего». Неизвестные имена предметов пропускаются
cfg-starter-equipment=Стартовое снаряжение. Броню с сеткой модулей ставьте первой: следующие записи вставляются в её сетку. Заменяйте таблицу целиком
cfg-ring-tiles=Какой тайл кладётся в каждой из четырёх зон кольца
cmd-config-help=Открывает окно параметров: значения, момент вступления изменений в силу и назначение
cfg-title=[img=virtual-signal/signal-info] Параметры
cfg-head=Команда консоли: [color=yellow]/sc storage.имя = значение[/color].\n[color=green]Зелёное[/color] действует сразу, [color=yellow]жёлтое[/color] ждёт своего момента, [color=gray]серое[/color] сейчас не работает.
cmd-config-console=Команду надо выполнять в игре: у консоли сервера нет окна
cfg-applies-live=сразу
cfg-applies-live-tip=Действует немедленно для всех: значение читается заново при каждом обращении и не кешируется.
cfg-applies-reload=после перезагрузки
cfg-applies-reload-tip=Вступает в силу после перезагрузки или восстановления сценария; уже созданные объекты меняются не сразу.
cfg-applies-grow=сразу (только рост)
cfg-applies-grow-tip=Пересчитывается сразу, но кольцо только расширяется. Уменьшение проявится лишь после пересоздания.
cfg-applies-repaint=новые тайлы
cfg-applies-repaint-tip=Влияет только на тайлы, укладываемые в дальнейшем. Уже уложенная земля не перекрашивается.
cfg-applies-reset=следующий сброс
cfg-applies-reset-tip=Применяется при следующем сбросе этого мира.
cfg-applies-new=только новое
cfg-applies-new-tip=Влияет только на создаваемое в дальнейшем; существующее не меняется.
cfg-applies-dead=не работает
cfg-applies-dead-tip=Сейчас это значение ни на что не влияет. Оставлено, чтобы не притворяться работающим.
ship-scuttled=[color=yellow]__1__[/color] разобрал свой корабль
overview-scuttle=Разобрать корабль
overview-scuttle-tip=Уничтожает ваш собственный корабль.\n[color=red]Всё, что было на борту, исчезнет вместе с ним, и отменить это нельзя.[/color]\nКорабль может быть только один, так что разбор освобождает место под новый.\nПервое нажатие взводит кнопку, второе выполняет действие.
overview-scuttle-confirm=[color=red]Подтвердить разбор[/color]
overview-scuttle-confirm-tip=[color=red]Ещё одно нажатие немедленно уничтожит этот корабль.[/color]\nВсё, что на борту, пропадёт вместе с ним.\nПередумали? Подождите десять секунд, и кнопка вернётся в обычное состояние.
cfg-ring-pond-half=Радиус мелководья в центре кольца, в тайлах; 0 означает, что пруда нет
cfg-ring-always-day=Вечный день на кольцах. Если включено, солнечные панели круглые сутки работают на полную и аккумуляторы не нужны
cfg-world-resource-boost=Public-world ore multipliers: Nauvis size/frequency x2; all planets richness x1/16
ring-deleted-by-admin=[color=red]Ваше кольцо удалил администратор __1__[/color]. Опыт не тронут: нажмите кнопку кольца, и оно вырастет прежней ширины.
cfg-ring-length-bonus=Free levels. Length = length_per_level x (total level + this); default is 16 x (level + 4)
cfg-ship-width-per-level=На сколько тайлов корабль расширяется за уровень
cfg-ship-width-bonus=Бесплатные уровни для корабля. Ширина = на уровень x (уровень + это), то есть 16 x (4 + уровень)
travel-convert-rate=[color=acid]Колбы в приёмных сундуках обмениваются автоматически каждые __1__ мин[/color] и тратят те же силы, что и ручной обмен. Всё нужное для исследований вынимайте до следующего прохода.
cfg-auto-convert-minutes=Период автообмена для игроков в сети, в минутах
