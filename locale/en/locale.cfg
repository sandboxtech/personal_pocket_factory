
description=\n[color=acid]Pocket Worlds[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]Your pocket world[/font]\nEveryone gets a private [color=acid]pocket world[/color]. Only you can enter, nobody can touch your stuff.\nBut it has [color=red]no resources at all[/color].\n\n[img=space-location/nauvis] [font=default-large-bold]Public worlds[/font]\nAll resources live in the [color=yellow]public worlds[/color]. Go mine, haul it back, process it at home.\nPublic worlds are [color=red]bounded[/color] and [color=red]reset on a timer[/color].\nThe five worlds reset [color=acid]staggered[/color], so there is always a fresh one to go to.\n\n[img=virtual-signal/signal-battery-mid] [font=default-large-bold]Stamina[/font]\n[color=acid]Stamina[/color] regenerates over time, [color=yellow]even while offline[/color], and stops at the cap.\nStamina can be [color=acid]gifted[/color] to other players.\n\n[img=virtual-signal/signal-science-pack] [font=default-large-bold]Experience[/font]\nSpend [color=acid]stamina[/color] to convert the [color=yellow]items[/color] in your inventory into [color=acid]experience[/color].\nExperience is the only thing here that is [color=yellow]never lost[/color]. World resets cannot take it.\nLevel = square root of experience. No cap.\n\n[img=item/blueprint-book] [font=default-large-bold]Blueprint library[/font]\nThe blueprint library is [color=red]disabled[/color]. Worlds reset, so you rethink your layout every time.\n\n\nVersion 0.1.0\nhttps://github.com/sandboxtech/pocket_worlds
scenario-name=[color=acid]Pocket Worlds[/color]

