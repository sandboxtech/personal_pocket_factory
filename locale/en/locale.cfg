# == One-line description for every config field shown by /pw-config ==
# Key -> pw.cfg-<field name with underscores as dashes>. The list itself lives in
# constants.TUNABLES / TUNABLE_TABLES, which also drives ensure_defaults, so the
# descriptions and the defaults cannot drift apart.
cfg-group-stamina=Stamina
cfg-group-ring=Ring shape
cfg-group-lifecycle=Ring lifecycle
cfg-group-world=Public worlds
cfg-group-ship=Ships
cfg-group-cycle=Scheduling
cfg-group-tech=Tech leak
cfg-group-misc=Misc
cfg-stamina-ticks-per-point=Game ticks needed for 1 stamina point (60 = one per second)
cfg-stamina-pending-cap=Claimable pool cap in points; stops accruing when full
cfg-stamina-balance-cap=Stamina pool cap in points
cfg-stamina-initial-multiple=Starting stamina as a multiple of the claimable cap (0 = none)
cfg-ring-height=Ring band height in tiles; also the map generation hard bound
cfg-ring-concrete-height=Height of the buildable middle band; the rest is open space
cfg-ring-base-half-width=Minimum half-width in tiles; minimum width is twice this
cfg-ring-per-level=Tiles the ring grows on each side per level
cfg-ring-public-hours=Offline hours before a ring goes public (veteran cap)
cfg-ring-delete-multiple=Deletion threshold as a multiple of the public threshold (3 means 3 h -> 9 h, 30 h -> 90 h)
cfg-ring-min-hours=Floor for both thresholds after playtime scaling
cfg-ring-hide-private=Hide private rings from the remote view surface list; public rings always show. false lets anyone remote-view and deconstruct private rings
cfg-public-size=Public planet side length in tiles (map boundary)
cfg-dropoff-limit=How many drop-offs one player may have at a time, universe-wide; the oldest beyond that returns to their inventory
cfg-world-climate-swing=How far each run's climate swings (Nauvis only). Biases the whole planet toward wet or dry and toward red desert; 0 keeps every run identical
cfg-world-terrain-scale=Size of terrain patches (Nauvis only). Lower values make each patch larger. It is also the water frequency, so lowering it means fewer, larger lakes
cfg-world-reset-offset-minutes=Minutes between each planet's first scheduled reset
cfg-ship-life-hours=Ship lifetime in hours before it is destroyed
cfg-ship-height=Ship surface height hard bound
cfg-ship-home-planet=Planet a new ship orbits by default
cfg-ship-lock-native-creation=Stop players creating or deleting platforms themselves; the UI becomes the only way (locks the button and blocks the input actions)
cfg-cycle-minutes=Period of the recurring tasks, in minutes
cfg-cycle-phase-minutes=Minutes between each recurring task phase
cfg-cycle-base-offset-minutes=Global offset for recurring tasks, to dodge planet resets
cfg-hud-refresh-ticks=Interface auto-refresh interval in game ticks
cfg-tech-loss-k-max=Upper bound of the leak coefficient: each round rolls 0 to this, chance% = pack count x that roll
cfg-detail-hours=Veteran threshold in played hours; gates the detailed numbers
cfg-starter-equipment-hours=Cooldown in hours before a respawn hands out the starter kit again
cfg-block-blueprint-library=Whether to disable the blueprint library
cfg-debug=Debug messages
cfg-world-reset-minutes=Per-planet reset period in minutes, keyed by planet name
cfg-world-warn-minutes=How many minutes ahead of a reset to warn players still standing on the planet (array, several steps allowed)
cfg-quality-exp=Experience multiplier per quality
cfg-starter-items=Starting kit for new players. Replace the whole table at once; {} means nothing at all. Unknown item names are skipped
