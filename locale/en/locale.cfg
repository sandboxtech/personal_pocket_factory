# ══ Help ══
help-title=How to play
# Covers only "how to play", with no specific numbers (reset cycles, probabilities, hour
# thresholds never appear here). Veteran players (played long enough, see
# storage.detail_hours) also see help-body-detail below this, see scripts/gui/help.lua.
help-body=[font=default-bold]Your ring[/font]\nOne per player, yours alone to enter. It is [color=acid]never wiped along with the planets[/color] and stays yours as long as you drop in now and then - only a long absence costs you it. It holds [color=red]no ore of any kind[/color], and there is a small shallow pond at its centre with room for offshore pumps on all four banks.\nIt is [color=acid]always daytime[/color] here, so solar panels carry you through the night without accumulators.\n\n[font=default-bold]When you die[/font]\nWherever you fall, you respawn on your own ring. [color=red]Your corpse and everything on it stay where you died[/color] and are gone once that planet resets.\nA fresh kit is handed out [color=yellow]at most once every __2__ hours[/color] (modular armor, personal roboport, solar panels, construction robots), so dying twice in a row will not earn you a second one.\n\n[font=default-bold]Twelve kinds of experience[/font]\nThe 12 science packs are tracked separately. A pack contributes as many levels as its experience has [color=yellow]decimal digits[/color], and all 12 add up to your total level.\nRing width = (total level + 2) x 32 tiles. Ship width = (total level + 4) x 16 tiles.\n\n[font=default-bold]Linked chests[/font]\nA hand-crafted wooden chest comes out as a [color=acid]linked chest[/color]. Placed anywhere outside your ring it becomes a drop-off, feeding straight into the receiving chests at your ring.\n[color=red]__1__ at a time[/color], counted across the whole universe; place one beyond that and your oldest returns to your inventory.\nThe chests [color=red]cannot be opened by hand[/color]; inserters move everything in and out.\n\n[font=default-bold]Public worlds[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] each run their own reset period. At the end of one, the whole planet is [color=red]wiped[/color].\nYou get a warning before it happens if you are still down there; take it as your cue to load a drop-off and leave.
# Tech leak / stamina / going inactive are [b]veteran-only[/b] (played at least storage.detail_hours).
# All three are rules you can plan around but don't need to start: a new player should get the
# gather -> ship -> earn loop running before worrying about tech decay or ring reclamation.
help-body-veteran=[font=default-bold]Stamina and conversion[/font]\nStamina regenerates 1 per second, offline included, and stops at the cap. 1 stamina converts 1 science pack.\nManual conversion lives in [color=acid]My ring[/color] and draws on your inventory; automatic conversion draws on the receiving chests, every __1__ min while you are online and every __2__ min while you are away. Both spend the same pool.\n\n[font=default-bold]Tech leak[/font]\nResearched technologies are periodically revoked; the chance rises with the number of pack types the technology requires. Levelled research drops one level rather than being wiped.\n\n[font=default-bold]Going inactive[/font]\nStay away long enough and your ring becomes public, open to anyone to enter and dismantle; longer still and it is reclaimed. Experience is unaffected.
# __1__-__5__ each planet's reset cycle in minutes (order: nauvis, vulcanus, gleba, fulgora, aquilo)
# __6__ tech-loss coefficient (required pack count x __6__ is roughly the revoke chance, as a percentage)
# __7__ offline-hours threshold before a ring goes public __8__ offline-hours threshold before it gets deleted
# All read live from storage; if an admin changes the config this text reflects it immediately.
# Veteran-only, see scripts/gui/help.lua
help-body-detail=[font=default-bold]The exact numbers[/font]\nPlanet reset cycles: [planet=nauvis] __1__ min, [planet=vulcanus] __2__ min, [planet=gleba] __3__ min, [planet=fulgora] __4__ min, [planet=aquilo] __5__ min.\nEach round rolls one coefficient between 0 and __6__; a technology's revoke chance that round, as a percentage, is its required pack count times that coefficient.\nStay offline __7__ hours and your ring becomes public property, anyone can enter; __8__ hours and it gets deleted, though your experience is never lost. Both thresholds scale with your total playtime, and the numbers above are the veteran cap. For a brand-new player they are as short as __9__ hours to public and __10__ hours to deletion.\nWarnings before a wipe: __11__ min.
