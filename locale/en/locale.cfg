
description=\n[color=acid]Personal Pocket Factory[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]Your ring[/font]\nEveryone gets a private [color=acid]ring[/color], yours alone to enter, with [color=red]no resources at all[/color].\nEarn experience and it grows wider.\n\n[img=item/linked-chest] [font=default-large-bold]Linked chests[/font]\nPlace a [color=yellow]wooden chest[/color] on a public world and it becomes a [color=acid]linked chest[/color], feeding straight into the [color=acid]receiving chests[/color] in your ring.\nNo more hauling ore home, just unload it with [color=yellow]inserters[/color].\n\n[img=space-location/nauvis] [font=default-large-bold]Public worlds reset[/font]\nThe five planets take turns resetting. Each reset [color=red]wipes the planet clean[/color], and [color=red]the whole server can randomly lose researched tech[/color].\nKeep producing and researching to stay ahead of the losses.\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]Staying away too long[/font]\nYour ring turns into [color=acid]public property[/color] first, open to anyone, then gets deleted if you stay away even longer.\nBut [color=acid]your experience is never lost[/color]. Come back and the ring grows right back.\n\n\nVersion 0.2.0\nhttps://github.com/sandboxtech/personal_pocket_factory
scenario-name=[color=acid]Personal Pocket Factory[/color]

[pw]

# ══ Basics ══
welcome=[color=acid]Welcome to the Dyson Ring Project[/color]\nYour ring starts with nothing. Hit [color=yellow]Travel[/color] up top to go gather, then drop a [color=yellow]wooden chest[/color] to ship goods home.
ring-rebuilt=[color=yellow]Your ring grew back[/color] (it had been deleted, but your experience was untouched, so it's back at the same width)
close=Close

# ══ HUD ══
# The trimmed HUD now has two rows: an icon-only travel bar right at the top of the screen
# (no translation needed, captions are hardcoded rich text in the code), and a row with
# level + current stamina + the feature buttons. Stamina cap, claimable progress, the
# claim button, convert, and experience all moved into the merged "Status" window
# (scripts/gui/status.lua).
# Veteran players (util.is_veteran) get one extra item on this row: ring width. New players
# don't need that number to play, so it stays off their screen.
# __1__ level
hud-level=[img=virtual-signal/signal-science-pack] Lv.[color=acid]__1__[/color]
# __1__ current stamina pool points (cap is shown in the "Claim" sub-window)
hud-balance=[img=virtual-signal/signal-battery-mid-level] Stamina [color=acid]__1__[/color]
# __1__ ring width (tiles). Veteran-only, see scripts/gui/hud.lua
hud-ring-width=Width [color=yellow]__1__[/color]
# __1__ icon-plus-localized planet name (util.planet_label, reads like "[planet=nauvis] Nauvis").
# Tooltip for the icon-only planet buttons in the top travel bar
hud-go-planet-tip=Travel to __1__
# __1__ points actually claimed
stamina-claimed=[color=acid]Claimed __1__ stamina points[/color]
# __1__ shown as the claim button's tooltip when under 1 point, and when a claim click yields nothing
stamina-none-yet=Not even 1 point saved up yet
btn-travel=Travel
btn-travel-tip=Head back to your own ring, or out to the five public planets to gather.\nEach planet has a reset timer; check how long is left before you go.
# Merges what used to be three separate buttons (Claim / Convert / Experience), see scripts/gui/status.lua
btn-status=My Ring
btn-status-tip=Stamina, conversion, experience.\nStamina ticks up 1/sec; 1 point turns 1 science pack into experience, and experience is what widens your ring.
btn-help=How to play

