cmd-config-help=Open the parameter window: every hot-tunable value, when a change takes effect, and what it does
# == Config overview window (/pw-config, see scripts/gui/config.lua) ==
cfg-title=[img=virtual-signal/signal-info] Parameters
cfg-head=Console command: [color=yellow]/sc storage.name = value[/color].\n[color=green]Green[/color] takes effect immediately, [color=yellow]yellow[/color] waits for a specific moment, [color=gray]grey[/color] currently does nothing.
cmd-config-console=Run this in-game; the server console has no window to open
# Effect-scope badges and their tooltips
cfg-applies-live=live
cfg-applies-live-tip=Takes effect immediately for everyone; read fresh at every use, never cached.
cfg-applies-grow=live (grow only)
cfg-applies-grow-tip=Recalculated at once, but rings only ever widen. Shrinking shows up only after a ring is rebuilt.
cfg-applies-repaint=new tiles
cfg-applies-repaint-tip=Only affects tiles painted from now on. Already-laid ground is never repainted.
cfg-applies-reset=next reset
cfg-applies-reset-tip=Applied when that world next resets.
cfg-applies-new=new only
cfg-applies-new-tip=Only affects things created from now on; existing ones are untouched.
cfg-applies-dead=inert
cfg-applies-dead-tip=This value currently does nothing. It is kept so it does not pretend to work.
ship-scuttled=[color=yellow]__1__[/color] scuttled their own ship
overview-scuttle=Scuttle ship
overview-scuttle-tip=Destroy your own ship.\n[color=red]Everything aboard goes with it, and this cannot be undone.[/color]\nYou can only have one ship at a time, so scuttling is how you make room for a new one.\nOne click arms the button; a second click carries it out.
overview-scuttle-confirm=[color=red]Confirm scuttle[/color]
overview-scuttle-confirm-tip=[color=red]Clicking again destroys this ship immediately.[/color]\nEverything aboard goes with it.\nChanged your mind? Wait ten seconds and the button returns to normal.
cfg-ring-pond-half=Radius in tiles of the shallow pond at the ring centre; 0 means no pond
cfg-ring-always-day=Whether rings have permanent daylight. With it on, solar panels run at full output around the clock and need no accumulators
cfg-world-resource-boost=Public-world ore multipliers: patch size / frequency / richness
ring-deleted-by-admin=[color=red]Your ring was deleted by the admin __1__[/color]. Your experience is untouched; hit the ring button and it grows back to the same width.
cfg-ring-level-bonus=Free levels. Width = per_level x (total level + this), i.e. 32 x (level + 2)
cfg-ship-width-per-level=Tiles a ship widens per level
cfg-ship-width-bonus=Free levels for ships. Width = per_level x (level + this), i.e. 16 x (4 + level)
travel-convert-rate=[color=acid]Science packs in your receiving chests auto-convert every __1__ min[/color], drawing on the same stamina pool as manual conversion. Pull out anything you want for research before the next pass.
cfg-auto-convert-minutes=Auto-conversion period in minutes for online players
cfg-auto-convert-offline-minutes=Auto-conversion period in minutes for offline players; sparser than online
help-footer=[font=default-bold]Community and feedback[/font]\nQQ group [color=acid]293280221[/color]\nProject [color=acid]https://github.com/sandboxtech/personal_pocket_factory[/color]
