
description=\n[color=acid]Personal Pocket Factory[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]Your ring[/font]\nEveryone gets a private [color=acid]ring[/color] — a 128-tall strip only you can enter.\nBut it has [color=red]no resources at all[/color].\nIts [color=yellow]width[/color] comes from experience, and [color=acid]every extra tile costs ten times more[/color],\nso veterans can never leave newcomers behind.\n\n[img=virtual-signal/signal-science-pack] [font=default-large-bold]Twelve kinds of experience[/font]\nEach of the [color=acid]12 science packs[/color] has its own ledger. Take the log of each, then add them up.\n[color=red]Miss one kind and that term is zero[/color] — to grow, you must visit every planet.\n\n[img=item/linked-chest] [font=default-large-bold]Linked chests[/font]\nWooden chests you place on public worlds become [color=acid]drop-off points[/color].\nAll of them feed the [color=acid]receiving array[/color] at the center of your ring.\nNo more hauling ore home — but you will need [color=yellow]inserters[/color] to unload it.\n\n[img=space-location/nauvis] [font=default-large-bold]Public worlds reset[/font]\nEach planet runs its own clock: Nauvis every hour, Aquilo every five.\nA reset wipes that planet clean — and [color=red]the whole server randomly loses researched technologies[/color].\nDeeper tech leaks faster, so the tech ceiling is set by everyone's throughput, not by any one player.\n\n[img=virtual-signal/signal-battery-mid] [font=default-large-bold]The cost of leaving[/font]\nAfter [color=yellow]30 hours[/color] offline your ring becomes [color=acid]public property[/color] — anyone may enter and take it apart.\nAfter [color=red]50 hours[/color] it is deleted.\nBut [color=acid]your experience is never lost[/color] — come back and the ring regrows to its old width.\n\n\nVersion 0.2.0\nhttps://github.com/sandboxtech/personal_pocket_factory
scenario-name=[color=acid]Personal Pocket Factory[/color]

[pw]

