# ══ Help ══
help-title=How to play
help-body=[font=default-bold]Your ring[/font]\nA private 128-tall strip only you can enter, but it has [color=red]no resources at all[/color].\nWidth = 32 x (2 + ring level), and level comes from your experience.\n\n[font=default-bold]Twelve kinds of experience[/font]\nEach of the 12 science packs keeps its own ledger. Take [color=yellow]log10[/color] of each and add them up.\n[color=red]Miss one kind and that term is zero[/color] -- to level up you must visit every planet.\n\n[font=default-bold]Linked chests[/font]\nWooden chests placed on public worlds become linked chests, feeding straight into the [color=acid]12 receiving chests[/color] at your ring's center (they share one inventory -- there are 12 only so inserters can pull in parallel).\nThe chests [color=red]cannot be opened by hand[/color] -- you need inserters to empty them.\n\n[font=default-bold]Public worlds[/font]\n[color=acid]Nauvis, Vulcanus, Gleba, Fulgora and Aquilo[/color] each reset on their own staggered schedule.\nA reset [color=red]wipes that planet clean[/color], including anything you left behind.\n\n[font=default-bold]Tech leak[/font]\nResearched technologies are periodically revoked at a chance of k x (that tech's science pack count) percent.\nDeeper tech leaks faster -- the ceiling is set by the whole server's throughput, not by any fixed cap.\n\n[font=default-bold]The cost of leaving[/font]\nAfter [color=yellow]30 hours[/color] offline your ring becomes [color=acid]public property[/color]: anyone can enter, dismantle it, and empty it -- the 12 receiving chests switch to the server-wide shared inventory.\nAfter [color=red]50 hours[/color] it is deleted.\nBut [color=acid]your experience is never lost[/color] -- come back and the ring regrows to its old width.\n\n[font=default-bold]Stamina[/font]\nRegenerates over time, even while offline, and stops at the cap. Converting experience costs stamina -- it is the only ticket you need.\n\n[font=default-bold]Admin[/font]\n/ring-delete <player name> manually deletes an offline player's ring, same effect as 50 hours offline.
