# ══ Help ══
help-title=How to play
# Covers only "how to play", with no specific numbers (reset cycles, probabilities, hour
# thresholds never appear here). Veteran players (played long enough, see
# storage.detail_hours) also see help-body-detail below this, see scripts/gui/help.lua.
help-body=[font=default-bold]The core loop[/font]\n[color=acid]Your ring is your long-term base[/color]. It never resets, and everything you build up there stays.\n[color=yellow]Public worlds reset soon[/color], and anything you leave on a planet resets with it.\nThe rhythm: go gather on a planet, ship it home through a linked chest, then process it and earn experience back at your ring.\nExperience widens your ring, and that's [color=acid]the only permanent growth[/color] in the game.\n\n[font=default-bold]Your ring[/font]\nYour own private world, yours alone to enter, with [color=red]no resources at all[/color].\n\n[font=default-bold]Twelve kinds of experience[/font]\nEach of the 12 science packs keeps its own ledger, added up with [color=yellow]log10[/color].\nMiss one and that term is [color=red]zero[/color]; you need to visit every planet to level up.\n\n[font=default-bold]Linked chests[/font]\nPlace a [color=yellow]wooden chest[/color] on a public world and it becomes a linked chest, feeding straight into the [color=acid]receiving chests[/color] at your ring's center.\nThe chests [color=red]can't be opened by hand[/color]; you need inserters to empty them.\n\n[font=default-bold]Public worlds[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] take turns resetting.\nA reset [color=red]wipes that planet clean[/color], including anything you left behind.\n\n[font=default-bold]Tech leak[/font]\nResearched technologies get revoked from time to time, and deeper tech leaks faster.\nKeep producing and researching to outpace the losses.\n\n[font=default-bold]Staying away too long[/font]\nYour ring turns into [color=acid]public property[/color] first: anyone can enter, dismantle it, and empty it.\nStay away even longer and it gets deleted.\nBut [color=acid]your experience is never lost[/color]; come back and the ring grows right back.\n\n[font=default-bold]Stamina[/font]\nRegenerates over time, even while offline, and stops at the cap. Converting experience costs stamina; it's the only ticket you need.
# __1__-__5__ each planet's reset cycle in minutes (order: nauvis, vulcanus, gleba, fulgora, aquilo)
# __6__ tech-loss coefficient (required pack count x __6__ is roughly the revoke chance, as a percentage)
# __7__ offline-hours threshold before a ring goes public __8__ offline-hours threshold before it gets deleted
# All read live from storage; if an admin changes the config this text reflects it immediately.
# Veteran-only, see scripts/gui/help.lua
help-body-detail=[font=default-bold]The exact numbers[/font]\nPlanet reset cycles: [planet=nauvis] __1__ min, [planet=vulcanus] __2__ min, [planet=gleba] __3__ min, [planet=fulgora] __4__ min, [planet=aquilo] __5__ min.\nA technology's revoke chance, as a percentage, is roughly its required pack count times __6__.\nStay offline __7__ hours and your ring becomes public property, anyone can enter; __8__ hours and it gets deleted, though your experience is never lost.

