# ══ Help ══
help-title=How to play
help-body=[font=default-bold]Pocket world[/font]\nYour private world. Only you can enter, nobody can touch your stuff. But it has no resources.\n\n[font=default-bold]Public worlds[/font]\nAll resources live in the public worlds. Go mine, haul it back, process it at home.\nPublic worlds are bounded and reset on a timer. The five worlds reset staggered, so there is always a fresh one.\nWhen a world resets, everything on it is erased, including anything you left behind.\n\n[font=default-bold]Stamina[/font]\nRegenerates over time, even while offline, and stops at the cap. Can be gifted to other players.\n\n[font=default-bold]Experience[/font]\nSpend stamina to convert inventory items into experience.\nExperience is the only thing never lost. World resets cannot take it.\nLevel = square root of experience. No cap.\n\n[font=default-bold]Blueprint library[/font]\nDisabled. Worlds reset, so you rethink your layout every time.
