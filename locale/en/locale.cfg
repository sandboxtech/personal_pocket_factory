description=\n[color=acid]Personal Pocket Factory[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]Your ring[/font]\nEveryone gets a private [color=acid]ring[/color], yours alone to enter, with [color=red]no resources at all[/color].\nEarn experience and it grows wider.\n\n[img=item/linked-chest] [font=default-large-bold]Linked chests[/font]\nPlace a [color=yellow]wooden chest[/color] on a public world and it becomes a [color=acid]linked chest[/color], feeding straight into the [color=acid]receiving chests[/color] in your ring.\nNo more hauling ore home, just unload it with [color=yellow]inserters[/color].\n\n[img=space-location/nauvis] [font=default-large-bold]Public worlds reset[/font]\nThe five planets take turns resetting. Each reset [color=red]wipes the planet clean[/color], and [color=red]the whole server can randomly lose researched tech[/color].\nKeep producing and researching to stay ahead of the losses.\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]Staying away too long[/font]\nYour ring turns into [color=acid]public property[/color] first, open to anyone, then gets deleted if you stay away even longer.\nBut [color=acid]your experience is never lost[/color]. Come back and the ring grows right back.\n\n\nVersion 0.2.0\nhttps://github.com/sandboxtech/personal_pocket_factory\nQQ group 293280221
scenario-name=[color=acid]Personal Pocket Factory[/color]
[pw]
# ══ Basics ══
welcome=[color=acid]Welcome to the Dyson Ring Project[/color]\nYour ring starts with nothing. Hit [color=yellow]Travel[/color] up top to go gather, then drop a [color=yellow]wooden chest[/color] to ship goods home.
ring-rebuilt=[color=yellow]Your ring grew back[/color] (it had been deleted, but your experience was untouched, so it's back at the same width)
starter-equipment=[color=acid]Resupplied[/color]: it has been over __1__ hours since you last took a starter kit, so this one is on the house. The armor is already worn and the modules are slotted in.
close=Close
# ══ HUD ══
