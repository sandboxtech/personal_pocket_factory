console-label=console du serveur
help-title=Comment jouer
help-body=[font=default-bold]La boucle principale[/font]\nVotre [color=acid]anneau n'est jamais réinitialisé[/color] : ce que vous y accumulez y reste.\n[color=yellow]Les cinq mondes extérieurs sont vidés régulièrement[/color], et ce que vous y laissez disparaît avec eux.\nD'où le rythme : récolter sur une planète, renvoyer le butin dans l'anneau via un coffre lié, puis transformer et accumuler de l'expérience chez soi.\nL'expérience élargit l'anneau, et c'est [color=acid]la seule progression permanente[/color] du jeu.\n\n[font=default-bold]Votre anneau[/font]\nUn terrain où vous seul pouvez entrer. [color=red]Aucune ressource[/color] : tout vient de l'extérieur.\n\n[font=default-bold]Douze sortes d'expérience[/font]\nLes 12 flacons sont comptés séparément : on prend le [color=yellow]nombre de chiffres[/color] de chacun, et la somme des 12 donne votre niveau.\n1 point vaut 1 niveau, puis chaque multiplication par dix en ajoute un.\nUne sorte dont vous n'avez rien compte [color=red]0[/color] : il faut donc visiter les cinq planètes.\n\n[font=default-bold]Coffres liés[/font]\nSi vous [color=yellow]fabriquez un coffre en bois à la main[/color], vous obtenez un [color=acid]coffre lié[/color] (ceux sortis d'un assembleur se convertissent à la pose).\nPosez-en un dehors comme [color=acid]point de collecte[/color] : tout ce qui y entre file droit vers les coffres de réception de votre anneau.\n[color=red]Un seul dans tout l'univers[/color] : en poser un nouveau efface l'ancien, l'emplacement est donc un vrai choix.\n[color=red]Personne ne peut les ouvrir à la main[/color] : tout entre et sort par bras robotisés.\n\n[font=default-bold]Conversion automatique[/font]\nLes flacons dans vos coffres de réception [color=acid]se transforment tout seuls en expérience[/color], à intervalles réguliers, même hors ligne.\nVous voulez en garder pour la recherche ? Sortez-les d'abord avec des bras robotisés. [color=yellow]Faire la course avec l'automatisme[/color] fait partie du jeu.\n\n[font=default-bold]Les cinq mondes extérieurs[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] passent à tour de rôle.\nCelle dont c'est le tour est [color=red]entièrement vidée[/color], y compris ce que vous y avez laissé.
help-body-veteran=[font=default-bold]Fuite technologique[/font]\nDes technologies déjà recherchées sont annulées de temps à autre, et plus on est loin dans l'arbre, plus ça fuit vite. Les recherches à niveaux ne retombent pas à zéro : elles perdent un niveau.\nIl n'y a qu'à produire et chercher davantage pour compenser.\n\n[font=default-bold]Énergie[/font]\nElle monte toute seule, même hors ligne, et s'arrête au plafond. Convertir coûte de l'énergie, c'est le seul ticket d'entrée.\n\n[font=default-bold]Absence prolongée[/font]\nVotre anneau devient d'abord [color=acid]public[/color] : n'importe qui peut y entrer, le démonter et le vider.\nSi l'absence se prolonge, il est démonté.\nMais votre [color=acid]expérience reste intacte[/color] : à votre retour, l'anneau repousse.
help-body-detail=[font=default-bold]Les chiffres exacts[/font]\nCycles de réinitialisation : [planet=nauvis] __1__ min, [planet=vulcanus] __2__ min, [planet=gleba] __3__ min, [planet=fulgora] __4__ min, [planet=aquilo] __5__ min.\nLa probabilité qu'une technologie soit annulée, en pourcentage, vaut environ son nombre de sortes de flacons × __6__.\nAprès __7__ h hors ligne, votre anneau devient public et s'ouvre à tous ; après __8__ h il est démonté, sans jamais perdre l'expérience.
btn-overview-tip=[font=default-bold]Serveur[/font]\nLes anneaux et les vaisseaux de tout le monde.\nQuand quelqu'un est absent assez longtemps, vous pouvez entrer dans son anneau. C'est aussi ici qu'on construit le sien.
