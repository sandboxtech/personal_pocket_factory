console-label=console du serveur
help-title=Comment jouer
help-body=[font=default-bold]Votre anneau[/font]\nUn par joueur, vous seul pouvez y entrer. Il [color=acid]n'est jamais effacé avec les planètes[/color] et reste le vôtre tant que vous passez de temps en temps : seule une longue absence vous le fait perdre. Il ne contient [color=red]aucun minerai[/color] et une petite mare peu profonde occupe son centre.\n\n[font=default-bold]Douze sortes d'expérience[/font]\nLes 12 flacons sont comptés séparément. Un flacon rapporte autant de niveaux que son expérience a de [color=yellow]chiffres[/color], et les 12 s'additionnent en niveau total.\nLargeur de l'anneau = (niveau total + 2) x 32 cases. Largeur du vaisseau = (niveau total + 4) x 16 cases.\n\n[font=default-bold]Coffres liés[/font]\nUn coffre en bois fabriqué à la main sort directement en [color=acid]coffre lié[/color]. Posé hors de votre anneau, il devient un point de collecte dont le contenu file droit vers les coffres de réception de l'anneau.\n[color=red]__1__ au maximum en même temps[/color] dans tout l'univers : en poser un de plus renvoie le plus ancien dans votre inventaire.\nLes coffres [color=red]ne s'ouvrent pas à la main[/color] ; tout entre et sort par bras robotisés.\n\n[font=default-bold]Mondes publics[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] ont chacun leur propre cycle de réinitialisation. À son terme, la planète entière est [color=red]effacée[/color].
help-body-veteran=[font=default-bold]Énergie et conversion[/font]\nL'énergie remonte de 1 par seconde, y compris hors ligne, et s'arrête au plafond. 1 énergie convertit 1 flacon.\nLa conversion manuelle se trouve dans « Mon anneau » et puise dans votre inventaire ; la conversion automatique passe une fois par minute et puise dans les coffres de réception. Les deux dépensent la même réserve.\n\n[font=default-bold]Fuite technologique[/font]\nLes technologies déjà recherchées sont périodiquement annulées ; la probabilité croît avec le nombre de sortes de flacons que la technologie exige. Les recherches à niveaux perdent un niveau au lieu d'être remises à zéro.\n\n[font=default-bold]Absence prolongée[/font]\nAu bout d'un certain temps sans connexion, votre anneau devient public, ouvert à l'entrée et au démontage ; plus longtemps encore, et il est démonté. L'expérience n'est pas touchée.
help-body-detail=[font=default-bold]Les chiffres exacts[/font]\nCycles de réinitialisation : [planet=nauvis] __1__ min, [planet=vulcanus] __2__ min, [planet=gleba] __3__ min, [planet=fulgora] __4__ min, [planet=aquilo] __5__ min.\nChaque tour tire un coefficient entre 0 et __6__ ; la probabilité qu'une technologie soit annulée ce tour-là vaut, en pourcentage, son nombre de sortes de flacons × ce coefficient.\nAprès __7__ h hors ligne, votre anneau devient public et s'ouvre à tous ; après __8__ h il est démonté, sans jamais perdre l'expérience. Les deux seuils augmentent avec votre temps de jeu total ; les valeurs ci-dessus sont le plafond vétéran. Pour un nouveau joueur, c'est au minimum __9__ h avant la mise en public et __10__ h avant la suppression.
btn-overview-tip=[font=default-bold]Serveur[/font]\nLes anneaux et les vaisseaux de tout le monde.\nQuand quelqu'un est absent assez longtemps, vous pouvez entrer dans son anneau. C'est aussi ici qu'on construit le sien.
