cmd-repair-help=Réparation : compléter les valeurs par défaut manquantes, recréer le groupe de permissions, créer les mondes manquants, réaligner tous les anneaux. Idempotent, exécutable à tout moment
cmd-repair-done=[color=acid]Réparation terminée[/color] : [color=yellow]__1__[/color] anneaux réalignés, paramètres de génération restaurés sur [color=yellow]__2__[/color] planètes.\nValeurs par défaut, groupe de permissions, déblocage de la carte stellaire et verrou du bouton de plateforme ont été réappliqués.\n[color=yellow]Le nettoyage des ressources n'apparaîtra qu'après la prochaine réinitialisation de chaque planète[/color] : la génération ne touche que les chunks à venir.
