cmd-import-none=Aucun fichier d'import exploitable n'a été chargé. Copiez [color=yellow]exp_import.lua[/color] dans le dossier du scénario à côté de control.lua, exécutez [color=acid]/c game.reload_script()[/color] puis réessayez. Le moteur ne lit le disque qu'au chargement du script : sans rechargement, il ne verra jamais un nouveau fichier.
cmd-import-preview=[color=yellow]Aperçu[/color] : le fichier contient [color=acid]__1__[/color] joueurs, dont [color=acid]__2__[/color] sont connus de cette sauvegarde (les noms inconnus ne sont pas une erreur : la correspondance se fait quand le joueur se connecte).\n[color=yellow]__3__[/color] champs inconnus ou invalides ont été ignorés.\n[color=red]Ceci écrase, cela ne fusionne pas[/color] : l'expérience et l'endurance de ces joueurs sont entièrement remplacées, et les joueurs absents du fichier ne sont pas touchés.\nPour exécuter, tapez [color=acid]/pw-import confirm[/color]
