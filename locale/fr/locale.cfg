description=\n[color=acid]Projet Anneau de Dyson[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]Votre anneau[/font]\nChacun reçoit son [color=acid]anneau personnel[/color] : vous seul pouvez y entrer, mais il n'y a [color=red]aucune ressource[/color].\nAccumulez de l'expérience et l'anneau s'élargit.\n\n[img=item/linked-chest] [font=default-large-bold]Coffres liés[/font]\nUn coffre en bois fabriqué à la main est directement un [color=acid]coffre lié[/color]. Posez-le dehors comme point de collecte et tout ce qui y entre file droit vers les coffres de réception de votre anneau.\nPlus besoin de porter le minerai, les [color=yellow]bras robotisés[/color] s'en chargent.\n\n[img=space-location/nauvis] [font=default-large-bold]Les mondes extérieurs sont réinitialisés[/font]\nLes cinq planètes y passent à tour de rôle : le moment venu, [color=red]tout y disparaît[/color], et le serveur [color=red]perd au hasard des technologies déjà recherchées[/color].\nSeuls ceux qui produisent et cherchent sans relâche gardent leurs technologies.\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]Absence prolongée[/font]\nVotre anneau devient d'abord [color=acid]public[/color] et s'ouvre à tous, puis il finit par être démonté.\nMais votre [color=acid]expérience reste intacte[/color] : à votre retour, l'anneau repousse à la même largeur.\n\n\nVersion 0.2.0\nProjet https://github.com/sandboxtech/personal_pocket_factory
scenario-name=[color=acid]Projet Anneau de Dyson[/color]

