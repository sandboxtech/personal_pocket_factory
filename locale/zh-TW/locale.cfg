console-label=伺服器主控台
help-title=玩法說明
help-body=[font=default-bold]戴森環[/font]\n每人一條，只有你能進。它[color=acid]不隨公共星球一起清空[/color]，只要偶爾上線就一直是你的，只有長期不上線才會失去。環裡[color=red]沒有任何礦產[/color]，中間有一小片淺水，四面岸上都能架岸邊幫浦。\n這裡[color=acid]永遠是白天[/color]，太陽能板不用配蓄電器也能通宵發電。\n\n[font=default-bold]死了怎麼辦[/font]\n不管死在哪兒，都在自己環裡復活。[color=red]屍體和身上的東西留在原地[/color]，那顆星球一重置就跟著沒了。\n裝備最多[color=yellow]每 __2__ 小時補一套[/color]（模組化裝甲、機動無人機調度站、太陽能板、建設無人機），連著送死也換不來第二套。\n\n[font=default-bold]十二種經驗[/font]\n12 種科技包各記各的帳。每種經驗的[color=yellow]十進位位數[/color]就是它給的級數，12 項相加是總等級。\n戴森環寬度 =（總等級 + 2）× 32 格。飛船寬度 =（總等級 + 4）× 16 格。\n\n[font=default-bold]連結箱[/font]\n手搓木箱做出來的直接是[color=acid]連結箱[/color]。放在戴森環之外就是投遞口，貨直通環裡的收貨箱。\n[color=red]全宇宙同時最多 __1__ 個[/color]，超出時最早放的那個自動退回背包。\n箱子[color=red]誰都打不開[/color]，進出靠機械臂。\n\n[font=default-bold]公共星球[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] 各有各的重置週期，到點整顆星球[color=red]清空[/color]。\n清空前會提前提醒還站在上面的人，看到就趕緊把貨塞進投遞口撤走。
help-body-veteran=[font=default-bold]體力與兌換[/font]\n體力每秒恢復 1 點，離線也恢復，攢滿即停。1 點體力兌換 1 個科技包。\n手動兌換在「我的戴森環」裡，吃背包；自動兌換吃收貨箱，線上時每 __1__ 分鐘一次，離線時每 __2__ 分鐘一次。兩者共用同一池體力。\n\n[font=default-bold]科技漏水[/font]\n已研究的科技會定期被撤銷，機率隨該科技需要的瓶子種類數上升。等級科技退一級，不清零。\n\n[font=default-bold]離線[/font]\n離線足夠久，戴森環轉為公共，任何人可進可拆；更久則被回收。經驗不受影響。
help-body-detail=[font=default-bold]具體數值[/font]\n五顆星球的重置週期：[planet=nauvis] __1__ 分鐘、[planet=vulcanus] __2__ 分鐘、[planet=gleba] __3__ 分鐘、[planet=fulgora] __4__ 分鐘、[planet=aquilo] __5__ 分鐘。\n每輪漏水先隨機一個 0~__6__ 的係數，某項科技這輪被撤銷的機率（百分比）就是它需要的瓶子種類數 × 該係數。\n離線滿 __7__ 小時，環會變成公共資產，誰都能進；滿 __8__ 小時後會被回收，但經驗不會丟。 這兩個門檻按累計在線時長縮放，上面是老玩家的上限；新人最短 __9__ 小時變公共、__10__ 小時刪除。\n星球清空前的提醒時間點：__11__ 分鐘。
btn-overview-tip=[font=default-bold]全服[/font]\n看所有人的環和飛船。\n誰離線夠久，他的環就能進去逛。自己的飛船也在這兒建。
