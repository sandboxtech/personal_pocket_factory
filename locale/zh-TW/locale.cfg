description=\n[color=acid]《戴森環計畫》[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]你的環[/font]\n每人一條[color=acid]專屬戴森環[/color]，只有你能進，但[color=red]一顆礦都沒有[/color]。\n攢經驗，環跟著變寬。\n\n[img=item/linked-chest] [font=default-large-bold]連結箱[/font]\n手搓的木箱直接就是[color=acid]連結箱[/color]。放到外面當投遞口，貨直通環裡的收貨箱。\n礦不用背，[color=yellow]機械手臂[/color]往裡塞就行。\n\n[img=space-location/nauvis] [font=default-large-bold]外面會重置[/font]\n五顆星球輪著清空，一到點[color=red]全沒[/color]，[color=red]全服還會隨機掉科技[/color]。\n多產多研究，科技才留得住。\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]太久不上線[/font]\n環先轉成[color=acid]公共的[/color]任人進出，再久一點直接回收。\n但[color=acid]經驗一點不少[/color]，回來照樣長出來。\n\n\n版本號 0.2.0\n專案位址 https://github.com/sandboxtech/personal_pocket_factory
