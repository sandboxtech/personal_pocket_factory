help-title=玩法說明
help-body=[font=default-bold]怎麼玩[/font]\n你的[color=acid]環不會重置[/color]，在這兒攢下的東西一直都在。\n[color=yellow]外面五顆星球隔一陣子就清空一次[/color]，留在那兒的東西跟著一起沒。\n所以路子是：出門採礦，用連結箱把貨寄回環裡，回來慢慢加工、攢經驗。\n經驗讓環變寬，[color=acid]只有這一樣是永久的[/color]。\n\n[font=default-bold]你的環[/font]\n只有你能進的一塊地，[color=red]一顆礦都沒有[/color]，全靠從外面運。\n\n[font=default-bold]十二種經驗[/font]\n12 種瓶子各記各的帳，每種取[color=yellow]十進位位數[/color]，12 項加起來就是等級。\n攢到 1 點算 1 級，往後每翻十倍再加一級。\n哪種一點沒攢，那項就是 [color=red]0[/color]，所以五顆星球都得跑到。\n\n[font=default-bold]連結箱[/font]\n你[color=yellow]手搓木箱[/color]，出來的直接就是[color=acid]連結箱[/color]（組裝機產的木箱放下去也會變）。\n把它放在外面當[color=acid]投遞口[/color]，塞進去的貨直通環裡的收貨箱。\n[color=red]全宇宙只能放一個[/color]，放了新的舊的就沒了，所以放哪兒得想想。\n箱子[color=red]誰都打不開[/color]，進貨出貨全靠機械手臂。\n\n[font=default-bold]自動兌換[/font]\n收貨箱裡的瓶子會[color=acid]隔一陣自動變成經驗[/color]，你不在線也照換。\n想留著做研究就早點用機械手臂拉走，[color=yellow]跟自動兌換搶貨[/color]本來就是玩法的一部分。\n\n[font=default-bold]外面的五顆星球[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] 輪著重置。\n輪到誰，誰身上的一切[color=red]全清[/color]，你擱那兒的東西也一樣。
help-body-veteran=[font=default-bold]科技漏水[/font]\n已經研究出來的科技會時不時被撤掉，越靠後的科技漏得越快。等級科技不清零，只退一級。\n只能多產多研究，把漏掉的補回來。\n\n[font=default-bold]體力[/font]\n自己會漲，離線也漲，漲滿就停。換經驗要花體力，這是唯一的門票。\n\n[font=default-bold]太久不上線[/font]\n你的環會先[color=acid]轉成公共的[/color]，誰都能進、能拆、能搬空。\n再久一點，環直接回收。\n但[color=acid]經驗一點不少[/color]，你回來它照樣長出來。
help-body-detail=[font=default-bold]具體數值[/font]\n五顆星球的重置週期：[planet=nauvis] __1__ 分鐘、[planet=vulcanus] __2__ 分鐘、[planet=gleba] __3__ 分鐘、[planet=fulgora] __4__ 分鐘、[planet=aquilo] __5__ 分鐘。\n某項科技被撤銷的機率（百分比）大約等於它需要的瓶子種類數 × __6__。\n離線滿 __7__ 小時，環會變成公共資產，誰都能進；滿 __8__ 小時後會被回收，但經驗不會丟。
btn-overview-tip=[font=default-bold]全服[/font]\n看所有人的環和飛船。\n誰離線夠久，他的環就能進去逛。自己的飛船也在這兒建。
