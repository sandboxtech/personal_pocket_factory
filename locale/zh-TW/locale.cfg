cfg-world-climate-swing=每輪氣候的擺動幅度（僅 Nauvis）。偏置整顆星球的乾濕與紅土傾向，0 表示每輪氣候都一樣
cfg-world-terrain-scale=地貌塊大小（僅 Nauvis）。越小每片地貌鋪得越大。它同時是水的頻率，調小也會讓湖泊更少更大
cfg-world-reset-offset-minutes=相鄰星球首次排程錯開多少分鐘
cfg-ship-life-hours=飛船壽命（小時），到點銷毀
cfg-ship-height=飛船的高度硬邊界（格）
cfg-ship-home-planet=新飛船預設環繞哪顆星球
cfg-ship-lock-native-creation=禁止玩家自己建船和刪船，UI 是唯一入口（同時關按鈕和禁權限動作）
cfg-cycle-minutes=週期任務的週期（分鐘）
cfg-cycle-phase-minutes=各類週期任務之間錯開多少分鐘
cfg-cycle-base-offset-minutes=週期任務整體偏移，用來避開星球重置時刻
cfg-hud-refresh-ticks=HUD 自動重新整理間隔（tick）
cfg-tech-loss-k-max=漏水係數的上限：每輪隨機取 0~它，機率% = 科技包種數 × 該係數
cfg-detail-hours=老玩家門檻（累計在線小時），決定誰看得到詳細數值
cfg-starter-equipment-hours=復活補發起始裝備的冷卻（小時）。距上次領取超過這麼久，復活時才會再給一套
cfg-block-blueprint-library=是否停用藍圖庫
cfg-debug=除錯播報
cfg-world-reset-minutes=每顆星球的重置週期（分鐘），按星球名索引
cfg-world-warn-minutes=重置前提前多久提醒還站在星球上的人（分鐘，陣列，可以填多檔）
cfg-quality-exp=各品質的經驗倍率
cfg-starter-items=新玩家的起手物資。整張表一次性替換，{} 表示什麼都不給。名字寫錯的那一項會被跳過
cfg-starter-equipment=起始裝備清單。帶裝備欄的裝甲要排在前面，後面的模組會插進它的裝備欄。整張表一次性替換
cfg-ring-tiles=環帶四種語義位置各鋪什麼磚
cmd-config-help=開啟參數視窗：所有可熱改的值、改完何時生效、以及它是幹什麼的
cfg-title=[img=virtual-signal/signal-info] 參數總覽
cfg-head=改法：[color=yellow]/sc storage.名字 = 新值[/color]。\n[color=green]綠色[/color]的改完立刻全服生效，[color=yellow]黃色[/color]的要等特定時機，[color=gray]灰色[/color]的目前不起作用。
cmd-config-console=這條指令要在遊戲裡執行，伺服器主控台開不了視窗
cfg-applies-live=立即
cfg-applies-live-tip=改完立刻對所有人生效，每次用到都是現讀的，不快取。
cfg-applies-grow=立即（只增）
cfg-applies-grow-tip=立刻重算，但環只會變寬不會變窄。調小了要等環被回收重建才看得出來。
cfg-applies-repaint=新地塊
cfg-applies-repaint-tip=只影響之後新鋪的磚。已經鋪好的地不會重鋪。
cfg-applies-reset=下次重置
cfg-applies-reset-tip=要等那個世界下一輪重置時才套用。
cfg-applies-new=僅新建
cfg-applies-new-tip=只對之後新建的東西生效，已經存在的不受影響。
cfg-applies-dead=無效
cfg-applies-dead-tip=目前這個值不起任何作用。留著是為了不假裝它能用。
ship-scuttled=[color=yellow]__1__[/color] 拆掉了自己的飛船
overview-scuttle=拆掉飛船
overview-scuttle-tip=把你自己的飛船拆掉。\n[color=red]船上的所有東西都會跟著消失，而且無法復原。[/color]\n每人同時只能有一艘飛船，想換一艘就得先拆掉現在這艘。\n點一下之後按鈕會變成確認狀態，再點一次才真的執行。
overview-scuttle-confirm=[color=red]確認拆掉[/color]
overview-scuttle-confirm-tip=[color=red]再點一次就會立刻拆掉這艘飛船。[/color]\n船上的所有東西都會跟著消失。\n不想拆的話，等十秒鐘按鈕就會自己恢復原狀。
cfg-ring-pond-half=環心淺水池的半徑（格）。0 表示不生成水池
cfg-ring-always-day=戴森環是否永晝。開著的話太陽能板 24 小時滿出力，不需要蓄電器
cfg-world-resource-boost=公共星球的礦脈倍率：面積 / 密度 / 單格礦量
ring-deleted-by-admin=[color=red]你的戴森環被管理員 __1__ 刪除了[/color]。經驗一點沒少，點回環按鈕就會按經驗重新長出來。
cfg-ring-level-bonus=白送的級數。寬度 = 每級步長 × (等級和 + 它)，即 32 ×（等級和 + 2）
cfg-ship-width-per-level=飛船每升一級加寬多少格
cfg-ship-width-bonus=飛船白送的級數。寬度 = 每級步長 ×（等級 + 它），即 16 ×（4 + 等級）
travel-convert-rate=[color=acid]收貨箱裡的科技包每 __1__ 分鐘自動兌換一次[/color]，和手動兌換花的是同一池體力。要留著做研究就趕在下一輪之前拉走。
cfg-auto-convert-minutes=自動兌換的週期（分鐘），線上玩家按這個節奏
cfg-auto-convert-offline-minutes=離線玩家的自動兌換週期（分鐘），比線上的稀疏
