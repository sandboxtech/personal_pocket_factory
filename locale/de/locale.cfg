help-title=Spielweise
help-body=[font=default-bold]Der Kernablauf[/font]\nDein [color=acid]Ring wird nie zurückgesetzt[/color]: Was du hier ansammelst, bleibt.\n[color=yellow]Die fünf Außenwelten werden regelmäßig geleert[/color], und was du dort zurücklässt, verschwindet mit.\nDaher der Ablauf: auf einem Planeten sammeln, per verbundener Kiste in den Ring schicken, zu Hause verarbeiten und Erfahrung sammeln.\nErfahrung verbreitert den Ring, und das ist [color=acid]das einzige dauerhafte Wachstum[/color] im Spiel.\n\n[font=default-bold]Dein Ring[/font]\nEin Stück Land, das nur du betreten kannst. [color=red]Keinerlei Rohstoffe[/color], alles muss von draußen kommen.\n\n[font=default-bold]Zwölf Erfahrungsarten[/font]\nDie 12 Wissenschaftspakete werden getrennt gezählt. Von jedem wird die [color=yellow]Stellenzahl[/color] genommen, und alle 12 zusammen ergeben deine Stufe.\n1 Punkt zählt 1 Stufe, danach kommt bei jeder Verzehnfachung eine dazu.\nEine Sorte, von der du nichts hast, zählt [color=red]0[/color]. Deshalb musst du alle fünf Planeten besuchen.\n\n[font=default-bold]Verbundene Kisten[/font]\nWenn du eine [color=yellow]Holzkiste von Hand fertigst[/color], bekommst du eine [color=acid]verbundene Kiste[/color] (in der Montagemaschine gefertigte wandeln sich beim Platzieren um).\nStell sie draußen als [color=acid]Abgabestelle[/color] auf, und alles, was hineinkommt, geht direkt in die Empfangskisten deines Rings.\n[color=red]Nur eine im ganzen Universum[/color]: Stellst du eine neue auf, ist die alte weg, die Platzwahl ist also eine echte Entscheidung.\n[color=red]Niemand kann sie von Hand öffnen[/color], das Be- und Entladen übernehmen Greifarme.\n\n[font=default-bold]Automatische Umwandlung[/font]\nPakete in den Empfangskisten [color=acid]werden von selbst zu Erfahrung[/color], in festen Abständen, auch während du offline bist.\nWillst du welche zum Forschen behalten, hol sie vorher mit Greifarmen heraus. [color=yellow]Das Wettrennen mit der Automatik[/color] gehört zum Spiel.\n\n[font=default-bold]Die fünf Außenwelten[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] kommen reihum dran.\nWer an der Reihe ist, wird [color=red]komplett geleert[/color], samt allem, was du dort gelassen hast.
help-body-veteran=[font=default-bold]Technologieverlust[/font]\nErforschte Technologien werden hin und wieder zurückgenommen, und je tiefer im Baum, desto schneller. Stufenbasierte Forschungen fallen nicht auf null, sondern nur um eine Stufe.\nDagegen hilft nur weiter produzieren und forschen.\n\n[font=default-bold]Ausdauer[/font]\nSteigt von allein, auch offline, und stoppt am Limit. Umwandeln kostet Ausdauer, mehr brauchst du nicht.\n\n[font=default-bold]Lange nicht online[/font]\nDein Ring wird zuerst [color=acid]öffentlich[/color]: Jeder darf hinein, abbauen und ausräumen.\nBleibst du noch länger weg, wird er abgeräumt.\nDeine [color=acid]Erfahrung bleibt aber unangetastet[/color], der Ring wächst nach deiner Rückkehr nach.
help-body-detail=[font=default-bold]Die genauen Zahlen[/font]\nReset-Intervalle: [planet=nauvis] __1__ Min., [planet=vulcanus] __2__ Min., [planet=gleba] __3__ Min., [planet=fulgora] __4__ Min., [planet=aquilo] __5__ Min.\nDie Rücknahmewahrscheinlichkeit einer Technologie in Prozent entspricht etwa der Zahl der benötigten Paketsorten × __6__.\nNach __7__ Std. offline wird dein Ring öffentlich und steht allen offen, nach __8__ Std. wird er abgeräumt, die Erfahrung geht dabei nie verloren.
