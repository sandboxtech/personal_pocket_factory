console-label=Serverkonsole
help-title=Spielweise
help-body=[font=default-bold]Dein Ring[/font]\nEiner pro Spieler, nur du kommst hinein. Er wird [color=acid]nicht mit den Planeten geleert[/color] und bleibt deiner, solange du ab und zu vorbeischaust; erst langes Fernbleiben kostet ihn. Er enthält [color=red]keinerlei Erz[/color]; in der Mitte liegt ein kleiner flacher Teich, an dessen vier Ufern überall Offshore-Pumpen Platz finden.\nHier ist [color=acid]immer Tag[/color], Solarpaneele tragen dich also ohne Akkus durch die Nacht.\n\n[font=default-bold]Wenn du stirbst[/font]\nEgal wo du fällst, du erscheinst auf deinem eigenen Ring wieder. [color=red]Leiche und alles, was du dabei hattest, bleiben am Sterbeort[/color] und sind mit dem nächsten Reset dieses Planeten weg.\nEine Ausrüstung gibt es [color=yellow]höchstens alle __2__ Std.[/color] (Modulpanzer, Roboterstation, Solarpaneele, Baurobotor) - zweimal hintereinander sterben bringt keinen zweiten Satz.\n\n[font=default-bold]Zwölf Erfahrungsarten[/font]\nDie 12 Wissenschaftspakete werden getrennt gezählt. Ein Paket zählt so viele Stufen, wie seine Erfahrung [color=yellow]Stellen[/color] hat; alle 12 ergeben zusammen deine Gesamtstufe.\nRingbreite = (Gesamtstufe + 2) x 32 Felder. Schiffsbreite = (Gesamtstufe + 4) x 16 Felder.\n\n[font=default-bold]Verbundene Kisten[/font]\nEine von Hand gefertigte Holzkiste kommt direkt als [color=acid]verbundene Kiste[/color] heraus. Außerhalb deines Rings aufgestellt wird sie zur Abgabestelle, deren Inhalt direkt in die Empfangskisten deines Rings geht.\n[color=red]Höchstens __1__ gleichzeitig[/color], über das ganze Universum gezählt; stellst du eine darüber hinaus auf, wandert die älteste zurück in dein Inventar.\nDie Kisten [color=red]lassen sich nicht von Hand öffnen[/color]; Greifarme erledigen das Be- und Entladen.\n\n[font=default-bold]Öffentliche Welten[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] haben je einen eigenen Reset-Zyklus. Läuft er ab, wird der ganze Planet [color=red]geleert[/color].\nWer dann noch unten steht, wird vorher gewarnt: Das ist das Signal, eine Abgabestelle zu füllen und zu verschwinden.
help-body-veteran=[font=default-bold]Ausdauer und Umwandlung[/font]\nAusdauer regeneriert 1 pro Sekunde, auch offline, und stoppt am Limit. 1 Ausdauer wandelt 1 Wissenschaftspaket um.\nDie manuelle Umwandlung sitzt in „Mein Ring" und greift auf dein Inventar zu; die automatische greift auf die Empfangskisten zu, alle __1__ Min. solange du online bist und alle __2__ Min. solange du weg bist. Beide zehren vom selben Vorrat.\n\n[font=default-bold]Technologieverlust[/font]\nErforschte Technologien werden regelmäßig zurückgenommen; die Wahrscheinlichkeit steigt mit der Zahl der Paketsorten, die die Technologie benötigt. Stufenbasierte Forschungen fallen um eine Stufe statt auf null.\n\n[font=default-bold]Längere Abwesenheit[/font]\nBleibst du lange genug weg, wird dein Ring öffentlich und steht allen zum Betreten und Abbauen offen; noch länger, und er wird abgeräumt. Die Erfahrung bleibt unberührt.
help-body-detail=[font=default-bold]Die genauen Zahlen[/font]\nReset-Intervalle: [planet=nauvis] __1__ Min., [planet=vulcanus] __2__ Min., [planet=gleba] __3__ Min., [planet=fulgora] __4__ Min., [planet=aquilo] __5__ Min.\nJede Runde wird ein Faktor zwischen 0 und __6__ gewürfelt; die Rücknahmewahrscheinlichkeit einer Technologie in dieser Runde entspricht in Prozent der Zahl ihrer Paketsorten × diesem Faktor.\nNach __7__ Std. offline wird dein Ring öffentlich und steht allen offen, nach __8__ Std. wird er abgeräumt, die Erfahrung geht dabei nie verloren. Beide Schwellen wachsen mit deiner Gesamtspielzeit; oben stehen die Werte für Veteranen. Bei einem neuen Spieler sind es mindestens __9__ Std. bis öffentlich und __10__ Std. bis zum Abräumen.\nVorwarnungen vor dem Reset: __11__ Min. vorher.
