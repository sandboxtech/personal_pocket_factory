description=\n[color=acid]Dyson-Ring-Projekt[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]Dein Ring[/font]\nJeder bekommt einen [color=acid]eigenen Ring[/color]. Nur du kommst hinein, aber es gibt dort [color=red]keinerlei Rohstoffe[/color].\nSammle Erfahrung, und der Ring wird breiter.\n\n[img=item/linked-chest] [font=default-large-bold]Verbundene Kisten[/font]\nEine von Hand gefertigte Holzkiste ist sofort eine [color=acid]verbundene Kiste[/color]. Stell sie draußen als Abgabestelle auf, und alles darin landet direkt in den Empfangskisten deines Rings.\nErz musst du nicht mehr schleppen, [color=yellow]Greifarme[/color] erledigen das.\n\n[img=space-location/nauvis] [font=default-large-bold]Die Außenwelten werden zurückgesetzt[/font]\nDie fünf Planeten kommen reihum dran: Ist die Zeit um, [color=red]verschwindet dort alles[/color], und [color=red]serverweit gehen zufällig erforschte Technologien verloren[/color].\nNur wer weiter produziert und forscht, behält seine Technologien.\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]Lange nicht online[/font]\nDein Ring wird zuerst [color=acid]öffentlich[/color] und steht allen offen, danach wird er abgeräumt.\nDeine [color=acid]Erfahrung bleibt aber unangetastet[/color]: Kommst du zurück, wächst der Ring in derselben Breite nach.\n\n\nVersion 0.2.0\nProjekt https://github.com/sandboxtech/personal_pocket_factory\nQQ-Gruppe 293280221
