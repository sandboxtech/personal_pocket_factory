cfg-applies-live-tip=Wirkt sofort für alle. Der Wert wird bei jeder Verwendung frisch gelesen und nie zwischengespeichert.
cfg-applies-grow=sofort (nur Wachstum)
cfg-applies-grow-tip=Wird sofort neu berechnet, aber Ringe werden nur breiter. Ein kleinerer Wert zeigt sich erst nach dem Neuaufbau.
cfg-applies-repaint=neue Felder
cfg-applies-repaint-tip=Betrifft nur künftig verlegte Felder. Bereits verlegter Boden wird nicht neu gezeichnet.
cfg-applies-reset=nächster Reset
cfg-applies-reset-tip=Wird beim nächsten Reset dieser Welt übernommen.
cfg-applies-new=nur Neues
cfg-applies-new-tip=Betrifft nur künftig Erzeugtes; Bestehendes bleibt unverändert.
cfg-applies-dead=wirkungslos
cfg-applies-dead-tip=Dieser Wert bewirkt derzeit nichts. Er bleibt hier, damit er nicht so tut, als würde er funktionieren.
ship-scuttled=[color=yellow]__1__[/color] hat das eigene Schiff verschrottet
overview-scuttle=Schiff verschrotten
overview-scuttle-tip=Zerstört dein eigenes Schiff.\n[color=red]Alles an Bord geht mit unter, und rückgängig machen lässt sich das nicht.[/color]\nDu kannst immer nur ein Schiff haben, das Verschrotten schafft also Platz für ein neues.\nEin Klick spannt die Schaltfläche, ein zweiter führt es aus.
overview-scuttle-confirm=[color=red]Verschrotten bestätigen[/color]
overview-scuttle-confirm-tip=[color=red]Noch ein Klick zerstört dieses Schiff sofort.[/color]\nAlles an Bord geht mit unter.\nDoch anders überlegt? Warte zehn Sekunden, dann setzt sich die Schaltfläche zurück.
cfg-ring-pond-half=Radius des flachen Teichs in der Ringmitte, in Feldern; 0 bedeutet kein Teich
cfg-ring-always-day=Ob auf Ringen immer Tag ist. Aktiviert liefern Solarpaneele rund um die Uhr volle Leistung und Akkus werden überflüssig
cfg-world-resource-boost=Erzmultiplikatoren der öffentlichen Welten: Fläche / Häufigkeit / Ergiebigkeit
ring-deleted-by-admin=[color=red]Dein Ring wurde von Administrator __1__ gelöscht[/color]. Deine Erfahrung bleibt unangetastet: Ein Klick auf den Ring-Knopf lässt ihn gleich breit nachwachsen.
cfg-ring-level-bonus=Geschenkte Stufen. Breite = pro Stufe x (Gesamtstufe + dieser Wert), also 32 x (Stufe + 2)
cfg-ship-width-per-level=Felder, die ein Schiff pro Stufe breiter wird
cfg-ship-width-bonus=Geschenkte Stufen fürs Schiff. Breite = pro Stufe x (Stufe + dieser Wert), also 16 x (4 + Stufe)
travel-convert-rate=[color=acid]Pakete in den Empfangskisten werden alle __1__ Min. automatisch umgewandelt[/color] und greifen auf dieselbe Ausdauer zu wie die manuelle Umwandlung. Was du für die Forschung brauchst, hol vor dem nächsten Durchlauf heraus.
cfg-auto-convert-minutes=Zeitraum der automatischen Umwandlung für Spieler online, in Minuten
cfg-auto-convert-offline-minutes=Zeitraum der automatischen Umwandlung für Offline-Spieler, in Minuten; seltener als online
