# ══ 玩法说明 ══
help-title=玩法说明
# 只讲"怎么玩"，不带任何具体数值（重置周期、概率、小时阈值都不出现在这里）。
# 老玩家（累计在线满 storage.detail_hours 小时）在这段下面还会看到 help-body-detail，
# 见 scripts/gui/help.lua。
help-body=[font=default-bold]怎么玩[/font]\n你的[color=acid]环不会重置[/color]，在这儿攒下的东西一直都在。\n[color=yellow]外面五个星球隔一阵子就清空一次[/color]，留在那儿的东西跟着一起没。\n所以路子是：出门采矿，用关联箱把货寄回环里，回来慢慢加工、攒经验。\n经验让环变长，[color=acid]只有这一样是永久的[/color]。\n\n[font=default-bold]你的环[/font]\n只有你能进的一块地，[color=red]一颗矿都没有[/color]，全靠从外面运。\n\n[font=default-bold]十二种经验[/font]\n12 种瓶子各记各的账，每种取[color=yellow]十进制位数[/color]，12 项加起来就是等级。\n攒到 1 点算 1 级，往后每翻十倍再加一级。\n哪种一点没攒，那项就是 [color=red]0[/color]，所以五个星球都得跑到。\n\n[font=default-bold]关联箱[/font]\n你[color=yellow]手搓木箱[/color]，出来的直接就是[color=acid]关联箱[/color]\n把它放在外面当[color=acid]投递口[/color]，塞进去的货直通环里的收货箱。\n[color=red]全宇宙只能放一个[/color]，放了新的旧的就没了，所以放哪儿得想想。\n箱子[color=red]谁都打不开[/color]，进货出货全靠机械臂。\n\n[font=default-bold]手动兑换：把背包里的瓶子换成经验[/font]\n点顶上的[color=acid]我的戴森环[/color]，里面第二段就是兑换。\n它只看你[color=yellow]背包里[/color]的科技瓶，给出一份预览，确认之后一次换掉。\n1 点体力换 1 个瓶子，体力不够就只换得动一部分。\n\n[font=default-bold]自动兑换：收货箱里的瓶子自己变经验[/font]\n收货箱里的科技瓶会[color=acid]每隔一段时间自动换成经验[/color]，你不在线的时候也照样进行。\n所以从外面运回来的瓶子不用管，它们会自己变成环的宽度。\n想留一批做研究的话，就早点用机械臂把瓶子从收货箱拉进实验室，\n[color=yellow]跟自动兑换抢货[/color]本来就是这个玩法的一部分。\n\n[font=default-bold]外面的五个星球[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] 轮着重置。\n轮到谁，谁身上的一切[color=red]全清[/color]，你搁那儿的东西也一样。
# 科技漏水 / 体力 / 长期不上线三段【只给老玩家看】（累计在线满 storage.detail_hours 小时）。
# 这三件事都是「知道了能规划、不知道也照样能上手」的规则：新人先把采集→送货→攒经验
# 这条主循环跑顺，比提前担心科技会掉、环会被公有化更重要。
help-body-veteran=[font=default-bold]科技漏水[/font]\n已经研究出来的科技会时不时被撤掉，越靠后的科技漏得越快。等级科技不清零，只退一级。\n只能多产多研究，把漏掉的补回来。\n\n[font=default-bold]体力[/font]\n自己会涨，离线也涨，涨满就停。换经验要花体力，这是唯一的门票。\n\n[font=default-bold]太久不上线[/font]\n你的环会先[color=acid]转成公共的[/color]，谁都能进、能拆、能搬空。\n再久一点，环直接回收。\n但[color=acid]经验一点不少[/color]，你回来它照样长出来。
# __1__～__5__ 五个星球各自的重置周期（分钟，按 nauvis/vulcanus/gleba/fulgora/aquilo 顺序）
# __6__ 科技撤销概率系数（该科技所需瓶种数 × __6__ ≈ 撤销概率的百分比）
# __7__ 戴森环公有化的离线小时阈值 __8__ 戴森环被删除的离线小时阈值
# 全部现读 storage，管理员改配置后这段文字立刻反映实际数值。只给老玩家看，见 scripts/gui/help.lua
help-body-detail=[font=default-bold]具体数值[/font]\n五个星球的重置周期：[planet=nauvis] __1__ 分钟、[planet=vulcanus] __2__ 分钟、[planet=gleba] __3__ 分钟、[planet=fulgora] __4__ 分钟、[planet=aquilo] __5__ 分钟。\n某项科技被撤销的概率（百分比）大约等于它需要的瓶子种类数 × __6__。\n离线满 __7__ 小时，戴森环会变成公共资产，谁都能进；满 __8__ 小时后会被删除，但经验不会丢。
