# ══ 玩法说明 ══
help-title=玩法说明
# 只讲"怎么玩"，不带任何具体数值（重置周期、概率、小时阈值都不出现在这里）。
# 老玩家（累计在线满 storage.detail_hours 小时）在这段下面还会看到 help-body-detail，
# 见 scripts/gui/help.lua。
help-body=[font=default-bold]戴森环[/font]\n每人一条，只有你能进。它[color=acid]不随公共星球一起清空[/color]，只要偶尔上线就一直是你的，只有长期不上线才会失去。环里[color=red]没有任何矿产[/color]，中间有一小片浅水，四面岸上都能架抽取泵。\n这里[color=acid]永远是白天[/color]，太阳能板不用配蓄电池也能通宵发电。\n\n[font=default-bold]死了怎么办[/font]\n不管死在哪儿，都在自己环里复活。[color=red]尸体和身上的东西留在原地[/color]，那颗星球一重置就跟着没了。\n装备最多[color=yellow]每 __2__ 小时补一套[/color]（模块装甲、机器人指令模块、太阳能板、建设机器人），连着送死也换不来第二套。\n\n[font=default-bold]十二种经验[/font]\n12 种科技包各记各的账。每种经验的[color=yellow]十进制位数[/color]就是它给的级数，12 项相加是总等级。\n戴森环宽度 =（总等级 + 2）× 32 格。飞船宽度 =（总等级 + 4）× 16 格。\n\n[font=default-bold]关联箱[/font]\n手搓木箱做出来的直接是[color=acid]关联箱[/color]。放在戴森环之外就是投递口，货直通环里的收货箱。\n[color=red]全宇宙同时最多 __1__ 个[/color]，超出时最早放的那个自动退回背包。\n箱子[color=red]谁都打不开[/color]，进出靠机械臂。\n\n[font=default-bold]公共星球[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] 各有各的重置周期，到点整颗星球[color=red]清空[/color]。\n清空前会提前提醒还站在上面的人，看到就赶紧把货塞进投递口撤走。
# 科技漏水 / 体力 / 长期不上线三段【只给老玩家看】（累计在线满 storage.detail_hours 小时）。
# 这三件事都是「知道了能规划、不知道也照样能上手」的规则：新人先把采集→送货→攒经验
# 这条主循环跑顺，比提前担心科技会掉、环会被公有化更重要。
help-body-veteran=[font=default-bold]体力与兑换[/font]\n体力每秒恢复 1 点，离线也恢复，攒满即停。1 点体力兑换 1 个科技包。\n手动兑换在「我的戴森环」里，吃背包；自动兑换吃收货箱，在线时每 __1__ 分钟一次，离线时每 __2__ 分钟一次。两者共用同一池体力。\n\n[font=default-bold]科技漏水[/font]\n已研究的科技会定期被撤销，概率随该科技需要的瓶子种类数上升。等级科技退一级，不清零。\n\n[font=default-bold]离线[/font]\n离线足够久，戴森环转为公共，任何人可进可拆；更久则被回收。经验不受影响。
# __1__～__5__ 五个星球各自的重置周期（分钟，按 nauvis/vulcanus/gleba/fulgora/aquilo 顺序）
# __6__ 科技撤销概率系数（该科技所需瓶种数 × __6__ ≈ 撤销概率的百分比）
# __7__ 戴森环公有化的离线小时阈值 __8__ 戴森环被删除的离线小时阈值
# 全部现读 storage，管理员改配置后这段文字立刻反映实际数值。只给老玩家看，见 scripts/gui/help.lua
help-body-detail=[font=default-bold]具体数值[/font]\n五个星球的重置周期：[planet=nauvis] __1__ 分钟、[planet=vulcanus] __2__ 分钟、[planet=gleba] __3__ 分钟、[planet=fulgora] __4__ 分钟、[planet=aquilo] __5__ 分钟。\n每轮漏水先随机一个 0~__6__ 的系数，某项科技这轮被撤销的概率（百分比）就是它需要的瓶子种类数 × 该系数。\n离线满 __7__ 小时，戴森环会变成公共资产，谁都能进；满 __8__ 小时后会被删除，但经验不会丢。 这两个门槛按累计在线时长缩放，上面是老玩家的上限；新人最短 __9__ 小时变公共、__10__ 小时删除。\n星球清空前的提醒时间点：__11__ 分钟。
btn-overview-tip=[font=default-bold]全服[/font]\n看所有人的环和飞船。\n谁离线够久，他的环就能进去逛。自己的飞船也在这儿建。
overview-title=[img=virtual-signal/signal-info] 全服总览
overview-empty=服务器上还没有别人的戴森环，你是第一个。
