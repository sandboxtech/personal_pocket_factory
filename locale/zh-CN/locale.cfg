
description=\n[color=acid]《戴森环计划》[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]你的戴森环[/font]\n每个人都有一条专属的[color=acid]戴森环[/color]，只有你能进，但[color=red]一颗矿都没有[/color]。\n攒经验，环跟着变宽。\n\n[img=item/linked-chest] [font=default-large-bold]关联箱[/font]\n把[color=yellow]木箱[/color]放到公共世界，它就变成[color=acid]关联箱[/color]，货直接送进环里的[color=acid]收货箱[/color]。\n矿不用背了，靠[color=yellow]机械臂[/color]搬进去就行。\n\n[img=space-location/nauvis] [font=default-large-bold]公共世界会重置[/font]\n五个星球轮流重置，一到点[color=red]全部清空[/color]，[color=red]全服还会随机丢科技[/color]。\n多产多研究，科技才留得住。\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]长期不上线[/font]\n你的环会先变[color=acid]公共资产[/color]，任人进出，再久一点会被删除。\n但[color=acid]经验一点不丢[/color]，回来环照样长出来。\n\n\n版本号 0.2.0\n项目地址 https://github.com/sandboxtech/personal_pocket_factory
scenario-name=[color=acid]戴森环计划[/color]

[pw]

# ══ 基础 ══
welcome=[color=acid]欢迎来到戴森环计划[/color]\n环里没资源，点顶部[color=yellow]传送[/color]出门采集，放个[color=yellow]木箱[/color]就能把货寄回来。
ring-rebuilt=[color=yellow]你的戴森环重新长出来了[/color]（之前被删过，但经验都在，宽度没变）
close=关闭

# ══ HUD ══
# 精简后的 HUD 只剩两行：屏幕最上方一排纯图标传送按钮（无需翻译，caption 直接写死在代码里），
# 加一行"等级 + 体力当前值 + 功能按钮"。体力上限、可领取进度、领取按钮都挪进"领取"子窗口。
# 老玩家（util.is_veteran）在这一行里多看到一项戴森环宽度，新人不看这个也不影响上手。
# __1__ 等级
hud-level=[img=virtual-signal/signal-science-pack] Lv.[color=acid]__1__[/color]
# __1__ 体力池当前点数（上限在"领取"子窗口里看）
hud-balance=[img=virtual-signal/signal-battery-mid-level] 体力 [color=acid]__1__[/color]
# __1__ 环宽（格）。只有老玩家才看得到这一项，见 scripts/gui/hud.lua
hud-ring-width=环宽 [color=yellow]__1__[/color]
# __1__ 星球名（surface 名）。屏幕最上方传送图标行里，星球按钮只有图标没有文字，靠这条 tooltip 说明目的地
hud-go-planet-tip=前往 __1__
btn-claim=领取
btn-claim-tip=点开看看攒了多少体力
# __1__ 攒不够 1 点时，领取按钮的提示；点击领取失败时也用这条
stamina-none-yet=还没攒够 1 点
# __1__ 实际领取到的体力点数
stamina-claimed=[color=acid]领取了 __1__ 点体力[/color]
btn-convert=兑换
btn-convert-tip=花体力，把科技瓶换成经验
btn-travel=传送
btn-travel-tip=回环、去公共世界，或去别人的戴森环串门
btn-exp=经验
btn-exp-tip=看经验明细，还差多少能升级
btn-help=玩法

# ══ 领取（体力子窗口） ══
claim-title=[img=virtual-signal/signal-battery-mid-level] 领取
# __1__ 体力池当前点数 __2__ 体力池上限点数。只给老玩家看，新人看 claim-balance-plain
claim-balance=体力池 [color=acid]__1__[/color]/__2__
# __1__ 体力池当前点数。新人版，不显示上限
claim-balance-plain=体力 [color=acid]__1__[/color]
# __1__ 可领取池当前能领的点数 __2__ 可领取池满额时对应的点数。只给老玩家看，新人看 claim-pending-plain
claim-pending=可领 [color=acid]__1__[/color]/__2__ 点
# __1__ 可领取池当前能领的点数。新人版，不显示上限
claim-pending-plain=可领 [color=acid]__1__[/color] 点
claim-do=领取
claim-do-tip=把攒的体力收进来

# ══ 兑换 ══
convert-title=[img=virtual-signal/signal-science-pack] 兑换经验
# __1__ 物品图标（形如 [item=xxx]） __2__ 背包里这一项的总数 __3__ 品质
# __4__ 这次配额下实际会兑掉多少个 __5__ 折算出的经验（已读化） __6__ 这一项要花几点体力
convert-row=__1__ × __2__ [color=yellow]__3__[/color]  这次兑 __4__ 个 → 经验 [color=acid]__5__[/color]（花 __6__ 点）
# __1__ 预计能兑换的总经验（已读化） __2__ 预计要花的体力点数
convert-total=预计经验 [color=acid]__1__[/color]，花体力 [color=yellow]__2__[/color] 点
# __1__ 当前体力池点数
convert-have=当前体力 [color=acid]__1__[/color] 点
convert-do=确认兑换
convert-cannot=体力不够，或者包里没有能兑的科技瓶
# __1__ 实际获得的经验（已读化）
convert-done=[img=virtual-signal/signal-science-pack] 兑换成功，经验 +[color=acid]__1__[/color]
convert-nothing=包里没有能兑的科技瓶
convert-no-stamina=体力不够
convert-no-character=没有角色，无法兑换
# __1__ 自动兑换实际获得的经验（已读化）。周期任务吃戴森环收货箱共享库存时，仅对在线玩家提示
auto-convert-done=[img=virtual-signal/signal-science-pack] 收货箱自动帮你兑换，经验 +[color=acid]__1__[/color]

# ══ 传送 ══
travel-title=[img=virtual-signal/signal-info] 传送
travel-home=回戴森环
travel-worlds-head=[font=default-bold]公共世界[/font]
# __1__ 距离下次科技流失判定还剩多少分钟。只给老玩家看，见 scripts/gui/travel.lua
travel-tech-timer=[color=red]约 __1__ 分钟后科技会漏一次[/color]
# 调度器（Task 12）上线前还没有「下次流失时刻」这个数据，用这条兜底文案。只给老玩家看
travel-tech-unscheduled=[color=gray]科技流失还没开始计时[/color]
# __1__ 星球名（surface 名），嵌进 [planet=xxx] 图标；每个星球图标不同，所以做成带参数的 key，
# 不能像下面的 travel-go 那样写死成一个不带图标的通用"前往"
travel-go-planet=前往[planet=__1__]
# __1__ 距重置还剩多少分钟（星球图标已经放进按钮文字里了，这一行只剩倒计时）
travel-world-row=还剩 [color=yellow]__1__[/color] 分钟重置
travel-go=前往
# __1__ 戴森环公有化的离线小时数阈值。整个"所有人的戴森环"板块只给老玩家看，见 scripts/gui/travel.lua
travel-rings-head=[font=default-bold]大家的戴森环[/font]（离线满各自的阈值就能进，新人阈值按在线时长缩放）
# __1__ 环主人名 __2__ 环宽（格） __3__ 环主人已离线多少小时
travel-ring-row=[color=acid]__1__[/color]  环宽 __2__  离线 [color=yellow]__3__[/color] 小时
# __1__ 距离可进入还差多少小时
travel-ring-locked=还要再离线 [color=yellow]__1__[/color] 小时才能进
travel-ring-gone=[color=red]这条戴森环已经不存在了[/color]
# __1__ 环主人名
travel-ring-locked-msg=[color=acid]__1__[/color] 的戴森环还没开放，进不去

# ══ 经验 ══
exp-title=[img=virtual-signal/signal-science-pack] 经验明细
exp-help=12 种科技瓶各算各的经验。\n哪种没攒，那项就是 [color=red]0[/color]，想升级得每种都攒。
# __1__ 累计数量（已读化） __2__ 下一个门槛（已读化，10 的整次幂）。线性进度条 = __1__/__2__
exp-amount=[color=acid]__1__[/color] / __2__
# __1__ 该瓶对等级的贡献（log10，取整显示）。只给老玩家看，见 scripts/gui/exp.lua
exp-contribution=[color=yellow]__1__[/color]
# __1__ 12 项贡献之和（取整显示） __2__ 当前等级 __3__ 当前环宽（格）。只给老玩家看
exp-sum=合计 [color=acid]__1__[/color]  等级 [color=yellow]__2__[/color]  环宽 __3__
# __1__ 升到下一级还差多少点贡献值（取整显示）
exp-next=还差 [color=yellow]__1__[/color] 点升级

# ══ 世界与科技 ══
# __1__ 星球名
world-not-ready=[color=red]__1__[/color] 还没准备好
# __1__ 星球名 __2__ 这个星球重置后的轮次编号
world-reset=[img=virtual-signal/signal-recycle] [color=yellow]__1__[/color] 已重置，进入第 [color=acid]__2__[/color] 轮
# __1__ 星球名（surface 名）
world-evacuated=[color=yellow]__1__[/color] 即将重置，你已被送回戴森环
# __1__ 本轮实际流失的科技数量 __2__ 流失的科技名列表（逗号分隔）
tech-lost=[color=red]科技漏水：这轮丢了 __1__ 项：__2__[/color]

# ══ 戴森环生命周期 ══
ring-evacuated=[color=yellow]主人已经回来[/color]，你被送回自己的戴森环
ring-reclaimed=[color=acid]戴森环收回来了[/color]，访客已请出，箱子重新只进你自己仓库
# __1__ 戴森环公有化的那个玩家名
ring-public=[color=yellow]__1__[/color] 太久没上线，戴森环[color=acid]公有化[/color]了，谁都能进
# __1__ 戴森环被删除的那个玩家名
ring-deleted=[color=red]__1__[/color] 的戴森环因为太久没上线被删了（[color=acid]经验没丢[/color]）

# ══ 投递口数量限制 ══
# __1__ 被移除的旧投递口所在的星球名（surface 名）
dropoff-replaced=[color=yellow]你在 __1__ 的旧投递口没了[/color]（同时只能有一个投递口，新的已经生效）

# ══ 管理员指令 ══
cmd-admin-only=只有管理员能使用这个指令
# __1__ 找不到的目标玩家名
cmd-no-player=[color=red]找不到玩家 __1__[/color]
cmd-player-online=该玩家在线，先让对方下线再删
cmd-no-ring=该玩家没有戴森环可删
cmd-ring-delete-help=删除指定玩家的戴森环（对方须离线；经验不受影响，下次上线会长回来）
cmd-ring-delete-usage=用法：/ring-delete <玩家名>
# __1__ 被删除戴森环的玩家名
cmd-ring-deleted=[color=acid]已删除 __1__ 的戴森环[/color]
# __1__ 被删除戴森环的玩家名 __2__ 执行删除的管理员名，或 console-label（从服务器控制台执行时，嵌套传入本 LocalisedString 代替玩家名）
cmd-ring-deleted-broadcast=[color=yellow]__1__[/color] 的戴森环被 [color=acid]__2__[/color] 删除
console-label=服务器控制台

# ══ 玩法说明 ══
help-title=玩法说明
help-body=[font=default-bold]戴森环[/font]\n你的专属世界，只有你能进，但[color=red]没有任何资源[/color]。\n经验越多，环越宽。\n\n[font=default-bold]十二种经验[/font]\n12 种科技瓶各算各的经验，取 [color=yellow]log10[/color] 后相加成等级。\n哪种没攒，那项就是 [color=red]0[/color]，想升级得五个星球都跑到。\n\n[font=default-bold]关联箱[/font]\n把[color=yellow]木箱[/color]放到公共世界，它就变成关联箱，直通你环里的[color=acid]收货箱[/color]。\n箱子[color=red]不能打开[/color]，得靠机械臂搬空。\n\n[font=default-bold]公共世界[/font]\n[color=acid]Nauvis / Vulcanus / Gleba / Fulgora / Aquilo[/color] 五个星球轮流重置。\n重置时那颗星球上的一切[color=red]清空[/color]，包括你留在那里的东西。\n\n[font=default-bold]科技漏水[/font]\n已研究的科技会不定期被撤销，科技越深越容易漏。\n多产多研究，才能补得上流失的速度。\n\n[font=default-bold]长期不上线[/font]\n你的戴森环会先变[color=acid]公共资产[/color]，任何人可进、可拆、可搬空。\n再久一点，环会被删除。\n但[color=acid]经验一点不丢[/color]，回来后环照样长出来。\n\n[font=default-bold]体力[/font]\n随时间恢复，离线也在攒，攒满就不再涨。兑换经验要花体力，是唯一的门票。
