description=\n[color=acid]《戴森环计划》[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]个人环带[/font]\n每人一条[color=acid]专属戴森环[/color]，只有本人可以进入，但[color=red]没有任何矿产[/color]。\n积累经验，环带随之延长。\n\n[img=item/linked-chest] [font=default-large-bold]关联箱[/font]\n手工制作的木箱会直接变成[color=acid]关联箱[/color]。放在外面作为投递口，货物直达环心收货箱。\n不必背矿，[color=yellow]机械臂[/color]送入箱子即可。\n\n[img=space-location/nauvis] [font=default-large-bold]公共星球[/font]\n五个星球轮流清空；时间一到，[color=red]整颗星球重置[/color]，[color=red]全服还会随机流失科技[/color]。\n持续生产、持续研究，科技才能保住。\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]离线超时[/font]\n长期离线后，戴森环会先转为[color=acid]公共戴森环[/color]，所有人都能进入；再久则被回收。\n但[color=acid]经验完整保留[/color]，回归后会按经验重新生成。\n\n\n版本号 0.2.0\n项目地址 https://github.com/sandboxtech/personal_pocket_factory\n交流群 293280221
scenario-name=[color=acid]戴森环计划[/color]
[pw]
# ══ 基础 ══
welcome=[color=acid]欢迎来到戴森环计划[/color]\n你的戴森环没有任何矿产。点击上方星球图标外出采集，放下[color=yellow]木箱[/color]就能把货物送回环内。
ring-rebuilt=[color=yellow]戴森环已重建[/color]。之前虽然被回收，经验仍然保留，长度也会按原进度恢复。
starter-equipment=[color=acid]补给已送达[/color]：你已经超过 __1__ 小时没有领取起始装备，这套补给归你。装甲已穿戴，模块已安装。
close=关闭
