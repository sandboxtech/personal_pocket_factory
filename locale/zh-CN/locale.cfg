cfg-applies-live-tip=改完立刻对所有人生效，每次用到都是现读的，不缓存。
cfg-applies-grow=立即（只增）
cfg-applies-grow-tip=立刻重算，但环只会变长不会变窄。调小了要等环被回收重建才看得出来。
cfg-applies-repaint=新地块
cfg-applies-repaint-tip=只影响之后新涂的砖。已经铺好的地不会重涂。
cfg-applies-reset=下次重置
cfg-applies-reset-tip=要等那个世界下一轮重置时才套用。
cfg-applies-new=仅新建
cfg-applies-new-tip=只对之后新建的东西生效，已经存在的不受影响。
cfg-applies-dead=无效
cfg-applies-dead-tip=目前这个值不起任何作用。留着是为了不假装它能用。
ship-scuttled=[color=yellow]__1__[/color] 拆掉了自己的飞船
overview-scuttle=拆掉飞船
overview-scuttle-tip=把你自己的飞船拆掉。\n[color=red]船上的所有东西都会跟着消失，而且无法撤销。[/color]\n每人同时只能有一艘飞船，想换一艘就得先拆掉现在这艘。\n点一下之后按钮会变成确认状态，再点一次才真的执行。
overview-scuttle-confirm=[color=red]确认拆掉[/color]
overview-scuttle-confirm-tip=[color=red]再点一次就会立刻拆掉这艘飞船。[/color]\n船上的所有东西都会跟着消失。\n不想拆的话，等十秒钟按钮就会自己恢复原状。
cfg-ring-pond-half=环心浅水池的半径（格）。0 表示不生成水池
cfg-ring-always-day=戴森环是否永昼。开着的话太阳能板 24 小时满出力，不需要蓄电池
cfg-world-resource-boost=公共星球的矿脉倍率：面积 / 密度 / 单格矿量
ring-deleted-by-admin=[color=red]你的戴森环被管理员 __1__ 删除了[/color]。经验一点没少，点回环按钮就会按经验重新长出来。
cfg-ring-level-bonus=白送的级数。宽度 = 每级步长 × (等级和 + 它)，即 32 ×（等级和 + 2）
cfg-ship-width-per-level=飞船每升一级加宽多少格
cfg-ship-width-bonus=飞船白送的级数。宽度 = 每级步长 ×（等级 + 它），即 16 ×（4 + 等级）
travel-convert-rate=[color=acid]收货箱里的科技包每 __1__ 分钟自动兑换一次[/color]，和手动兑换花的是同一池体力。要留着做研究就赶在下一轮之前拉走。
cfg-auto-convert-minutes=自动兑换的周期（分钟），在线玩家按这个节奏
cfg-auto-convert-offline-minutes=离线玩家的自动兑换周期（分钟），比在线的稀疏
