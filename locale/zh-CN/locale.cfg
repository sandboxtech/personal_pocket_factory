
description=\n[color=acid]《口袋世界》[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]你的口袋世界[/font]\n每个人都有一个专属的[color=acid]口袋世界[/color]，只有你能进，没人能拆你的东西。\n但它[color=red]一颗矿都没有[/color]。\n\n[img=space-location/nauvis] [font=default-large-bold]公共世界[/font]\n资源全在[color=yellow]公共世界[/color]。去采集，背回[color=acid]口袋世界[/color]加工。\n公共世界有[color=red]边界[/color]，而且会[color=red]定期重置[/color]。\n五个世界[color=acid]错峰[/color]重置，任何时候都有新鲜的世界可去。\n\n[img=virtual-signal/signal-battery-mid] [font=default-large-bold]体力[/font]\n[color=acid]体力[/color]随时间恢复，[color=yellow]离线也在攒[/color]，攒满就不再涨。\n体力可以[color=acid]转赠[/color]给别人。\n\n[img=virtual-signal/signal-science-pack] [font=default-large-bold]经验[/font]\n花[color=acid]体力[/color]，把背包里的[color=yellow]物资[/color]兑换成[color=acid]经验[/color]。\n[color=acid]经验[/color]是这里唯一[color=yellow]永远不会失去[/color]的东西，世界重置也带不走它。\n等级 = 经验的平方根，没有上限。\n\n[img=item/blueprint-book] [font=default-large-bold]蓝图库[/font]\n本场景[color=red]禁用蓝图库[/color]。世界会重置，布局要靠你自己重新想。\n\n\n版本号 0.1.0\n项目地址 https://github.com/sandboxtech/pocket_worlds
scenario-name=[color=acid]口袋世界[/color]

[pw]

# ══ 基础 ══
welcome=[color=acid]欢迎来到口袋世界[/color]\n这里是你的专属世界，没有资源。点顶部[color=yellow]公共世界[/color]按钮出门采集。
pocket-rebuilt=[color=yellow]你的口袋世界已重建[/color]（离线太久被回收过）
