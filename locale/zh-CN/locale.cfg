description=\n[color=acid]《戴森环计划》[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]你的环[/font]\n每人一条[color=acid]专属戴森环[/color]，只有你能进，但[color=red]一颗矿都没有[/color]。\n攒经验，环跟着变长。\n\n[img=item/linked-chest] [font=default-large-bold]关联箱[/font]\n手搓的木箱直接就是[color=acid]关联箱[/color]。放到外面当投递口，货直通环里的收货箱。\n矿不用背，[color=yellow]机械臂[/color]往里塞就行。\n\n[img=space-location/nauvis] [font=default-large-bold]外面会重置[/font]\n五个星球轮着清空，一到点[color=red]全没[/color]，[color=red]全服还会随机掉科技[/color]。\n多产多研究，科技才留得住。\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]太久不上线[/font]\n环先转成[color=acid]公共的[/color]任人进出，再久一点直接回收。\n但[color=acid]经验一点不少[/color]，回来照样长出来。\n\n\n版本号 0.2.0\n项目地址 https://github.com/sandboxtech/personal_pocket_factory\n交流群 293280221
scenario-name=[color=acid]戴森环计划[/color]
[pw]
# ══ 基础 ══
welcome=[color=acid]欢迎来到戴森环计划[/color]\n你的环里一颗矿都没有。点上面的星球图标出门采，随手放个[color=yellow]木箱[/color]就能把货寄回来。
ring-rebuilt=[color=yellow]你的环重新长出来了[/color]。之前被回收过，但经验一点没少，宽度还是原来那么宽。
starter-equipment=[color=acid]补给到了[/color]：你已经超过 __1__ 小时没领过起始装备，这一套算你的。装甲直接穿上了，模块也插好了。
close=关闭
