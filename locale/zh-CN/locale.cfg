
description=\n[color=acid]《戴森环计划》[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]你的戴森环[/font]\n每个人都有一条专属的[color=acid]戴森环[/color]，高 128 的环带，只有你能进。\n但它[color=red]一颗矿都没有[/color]。\n你攒的经验越多，环的[color=yellow]宽度[/color]越宽\n\n[img=virtual-signal/signal-science-pack] [font=default-large-bold]12 种经验[/font]\n[color=acid]12 种科技瓶[/color]经验各自取对数再相加。\n[color=red]缺任何一种，那一项就是零[/color]\n\n[img=item/linked-chest] [font=default-large-bold]关联箱[/font]\n你做的[color=yellow]木箱[/color]放到公共世界会变成[color=acid]投递口[/color]，\n所有投递口都通向你环中央那一组[color=acid]收货箱[/color]。\n矿不用背了，但箱子要靠[color=yellow]机械臂[/color]取货。\n\n[img=space-location/nauvis] [font=default-large-bold]公共世界会重置[/font]\n五个星球各有各的周期：Nauvis 一小时，Aquilo 五小时。\n重置时那颗星球上的一切都会消失，[color=red]全服还会随机失去已研究的科技[/color]。\n科技越深越容易漏——所以科技水位由全服的产能决定，不由任何人独占。\n\n[img=virtual-signal/signal-battery-mid] [font=default-large-bold]离线的代价[/font]\n离线 [color=yellow]30 小时[/color]，你的戴森环变成[color=acid]公共资产[/color]，任人进出拆改。\n离线 [color=red]50 小时[/color]，环被删除。\n但[color=acid]经验一点不丢[/color]，你回来时，环会按原来的宽度重新长出来。\n\n\n版本号 0.2.0\n项目地址 https://github.com/sandboxtech/personal_pocket_factory
scenario-name=[color=acid]戴森环计划[/color]

[pw]

