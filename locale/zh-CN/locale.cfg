# ══ 玩法说明 ══
help-title=玩法说明
# 只讲"怎么玩"，不带任何具体数值（重置周期、概率、小时阈值都不出现在这里）。
# 老玩家（累计在线满 storage.detail_hours 小时）在这段下面还会看到 help-body-detail，
# 见 scripts/gui/help.lua。
help-body=[font=default-bold]戴森环[/font]\n每人一条，仅本人可进入。它[color=acid]不会随公共星球清空[/color]，只要偶尔上线就会保留；长期离线才会失去。环内[color=red]没有任何矿产[/color]，中心有一小片浅水，四面岸边都能放置抽取泵。\n这里[color=acid]永远白天[/color]，太阳能板无需蓄电池也能持续发电。\n\n[font=default-bold]死亡处理[/font]\n无论死在哪里，都会在自己的戴森环复活。[color=red]尸体和随身物品会留在原地[/color]，那颗星球重置后就会消失。\n起始装备最多[color=yellow]每 __2__ 小时补发一套[/color]（模块装甲、机器人指令模块、太阳能板、建设机器人），连续死亡也不会重复领取。\n\n[font=default-bold]十二种经验[/font]\n12 种科技包分别记录经验。每种经验的[color=yellow]十进制位数[/color]就是对应级数，12 项相加就是总等级。\n戴森环长度 =（总等级 + 4）× 16 格。飞船宽度 =（总等级 + 4）× 16 格。\n\n[font=default-bold]关联箱[/font]\n手工制作的木箱会直接变成[color=acid]关联箱[/color]。放在戴森环之外就是投递口，货物直达环心收货箱。\n[color=red]全宇宙同时最多 __1__ 个[/color]，超出时最早放置的投递口会自动退回背包。\n箱子[color=red]无法手动打开[/color]，进出都靠机械臂。\n\n[font=default-bold]公共星球[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] 各有开放周期，到点会重置并关闭传送；关闭两小时后再次重置并开放。每次开放和关闭都会[color=red]清空整颗星球[/color]。\n状态切换前会全服提醒；看到关闭提醒后，请尽快把货物送入投递口并撤离。
# 科技失传 / 体力 / 长期不上线三段【只给老玩家看】（累计在线满 storage.detail_hours 小时）。
# 这三件事都是「知道了能规划、不知道也照样能上手」的规则：新人先把采集→送货→攒经验
# 这条主循环跑顺，比提前担心科技会掉、环会被公有化更重要。
help-body-veteran=[font=default-bold]体力与兑换[/font]\n体力每秒恢复 1 点，离线同样恢复，达到上限后停止增长。1 点体力兑换 1 个科技包。\n手动兑换在「我的戴森环」中消耗背包物品；自动兑换消耗收货箱库存，在线时每 __1__ 分钟一次，离线时每 __2__ 分钟一次。两者共用同一体力池。\n\n[font=default-bold]科技失传[/font]\n已研究科技会定期撤销，概率随该科技需要的科技包种类数提高。等级科技只降低一级，不会直接清零。\n\n[font=default-bold]离线[/font]\n离线足够久后，戴森环会转为公共，任何人都能进入和拆除；更久则被回收。经验不受影响。
# __1__～__5__ 五个星球各自的重置周期（分钟，按 nauvis/vulcanus/gleba/fulgora/aquilo 顺序）
# __6__ 科技撤销概率系数（该科技所需瓶种数 × __6__ ≈ 撤销概率的百分比）
# __7__ 戴森环公有化的离线小时阈值 __8__ 戴森环被删除的离线小时阈值
# 全部现读 storage，管理员改配置后这段文字立刻反映实际数值。只给老玩家看，见 scripts/gui/help.lua
help-body-detail=[font=default-bold]具体数值[/font]\n五个星球的重置周期：[planet=nauvis] __1__ 分钟、[planet=vulcanus] __2__ 分钟、[planet=gleba] __3__ 分钟、[planet=fulgora] __4__ 分钟、[planet=aquilo] __5__ 分钟。\n每轮科技失传会先随机取一个 0~__6__ 的系数；某项科技本轮被撤销的概率（百分比）= 所需科技包种类数 × 该系数。\n离线满 __7__ 小时，戴森环会转为公共资产，所有人都能进入；满 __8__ 小时后会被删除，但经验不会丢失。这两个门槛会按累计在线时长缩放，上面是老玩家上限；新人最短 __9__ 小时转公共、__10__ 小时删除。\n星球清空前的提醒时间点：__11__ 分钟。
