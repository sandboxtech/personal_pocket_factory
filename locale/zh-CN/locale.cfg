# ══ /pw-config 里每个配置项的一句话说明 ══
# 字段名 -> pw.cfg-<字段名，下划线换成短横>。清单本身在 constants.TUNABLES /
# TUNABLE_TABLES，那张表同时也是 ensure_defaults 的数据源，说明和默认值不会各说各话。
cfg-group-stamina=体力
cfg-group-ring=戴森环形状
cfg-group-lifecycle=戴森环生命周期
cfg-group-world=公共星球
cfg-group-ship=飞船
cfg-group-cycle=周期调度
cfg-group-tech=科技漏水
cfg-group-misc=其它
cfg-stamina-ticks-per-point=攒 1 点体力需要多少游戏刻（60 = 每秒 1 点）
cfg-stamina-pending-cap=可领取池上限（点），攒满就不再涨
cfg-stamina-balance-cap=体力池上限（点）
cfg-stamina-initial-multiple=新人初始体力 = 可领取上限的几倍（0 = 不送）
cfg-ring-height=环带总高（格），也是地图生成的硬边界
cfg-ring-concrete-height=中间可建带高度，其余均分给上下临空带
cfg-ring-base-half-width=半宽下限（格）。宽度下限是它的两倍
cfg-ring-per-level=每升一级两侧各外推多少格
cfg-ring-public-hours=离线多久后戴森环变公共（老玩家上限）
cfg-ring-delete-multiple=删除阈值是公共化阈值的几倍（3 倍即 3 小时→9 小时、30 小时→90 小时）
cfg-ring-min-hours=上面两个阈值按在线时长缩放后的下限
cfg-ring-hide-private=私人戴森环是否从遥控视角的平面列表里隐藏；公共环一律显示。改成 false 后私人环也能被遥控查看和拆除
cfg-public-size=公共星球的边长（格），地图边界限制
cfg-dropoff-limit=一个玩家同时能放几个投递口（全宇宙合计）。超出时最早的那个退回他的背包
cfg-world-climate-swing=每轮气候的摆动幅度（仅 Nauvis）。偏置整颗星球的干湿与红土倾向，0 表示每轮气候都一样
cfg-world-terrain-scale=地貌块大小（仅 Nauvis）。越小每片地貌铺得越大。它同时是水的频率，调小也会让湖泊更少更大
cfg-world-reset-offset-minutes=相邻星球首次排期错开多少分钟
cfg-ship-life-hours=飞船寿命（小时），到点销毁
cfg-ship-height=飞船的高度硬边界（格）
cfg-ship-home-planet=新飞船默认环绕哪颗星球
cfg-ship-lock-native-creation=禁止玩家自己建船和删船，UI 是唯一入口（同时关按钮和禁权限动作）
cfg-cycle-minutes=周期任务的周期（分钟）
cfg-cycle-phase-minutes=各类周期任务之间错开多少分钟
cfg-cycle-base-offset-minutes=周期任务整体偏移，用来避开星球重置时刻
cfg-hud-refresh-ticks=界面自动刷新间隔（游戏刻）
cfg-tech-loss-k-max=漏水系数的上限：每轮随机取 0~它，概率% = 科技包种数 × 该系数
cfg-detail-hours=老玩家门槛（累计在线小时），决定谁看得到详细数值
cfg-starter-equipment-hours=复活补发起始装备的冷却（小时）。距上次领取超过这么久，复活时才会再给一套
cfg-block-blueprint-library=是否禁用蓝图库
cfg-debug=调试消息
cfg-world-reset-minutes=每个星球的重置周期（分钟），按星球名索引
cfg-world-warn-minutes=重置前提前多久提醒还站在星球上的人（分钟，数组，可以填多档）
cfg-quality-exp=各品质的经验倍率
cfg-starter-items=新玩家的起手物资。整张表一次性替换，{} 表示什么都不给。名字写错的那一项会被跳过
cfg-starter-equipment=起始装备清单。带装备栏的装甲要排在前面，后面的模块会插进它的装备栏。整张表一次性替换
cfg-ring-tiles=环带四种语义位置各铺什么砖
