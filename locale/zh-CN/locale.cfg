# ══ 说明 ══
help-title=玩法说明
help-body=[font=default-bold]口袋世界[/font]\n你的专属世界，只有你能进，没人能拆你的东西。但它没有任何资源。\n\n[font=default-bold]公共世界[/font]\n资源全在公共世界。去采集，背回口袋世界加工。\n公共世界有边界，而且定期重置。五个世界错峰重置，任何时候都有新鲜的世界可去。\n重置时，那个世界上的一切都会消失，包括你留在那里的东西。\n\n[font=default-bold]体力[/font]\n随时间恢复，离线也在攒，攒满就不再涨。可以转赠给别人。\n\n[font=default-bold]经验[/font]\n花体力，把背包里的物资兑换成经验。\n经验是唯一永远不会失去的东西，世界重置也带不走它。\n等级 = 经验的平方根，没有上限。\n\n[font=default-bold]蓝图库[/font]\n本场景禁用蓝图库。世界会重置，布局要靠你自己重新想。
