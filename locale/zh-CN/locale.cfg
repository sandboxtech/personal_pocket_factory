welcome=[color=acid]欢迎来到戴森环计划[/color]\n你的环里一颗矿都没有。点上面的星球图标出门采，随手放个[color=yellow]木箱[/color]就能把货寄回来。
ring-rebuilt=[color=yellow]你的环重新长出来了[/color]。之前被回收过，但经验一点没少，宽度还是原来那么宽。
close=关闭
