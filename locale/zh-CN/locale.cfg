welcome=[color=acid]欢迎来到戴森环计划[/color]\n你的[color=acid]戴森环[/color]没有任何资源。点顶部[color=yellow]传送[/color]按钮出门，去公共世界采集，用关联箱把货寄回环里。
ring-rebuilt=[color=yellow]你的戴森环已重新长出[/color]（离线太久被删除过，但经验一点没丢，环按原宽度长回来了）
close=关闭

