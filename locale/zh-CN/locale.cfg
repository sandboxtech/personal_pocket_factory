# ══ 玩法说明 ══
help-title=玩法说明
help-body=[font=default-bold]戴森环[/font]\n你的专属世界：高 128 的环带，只有你能进，但[color=red]没有任何资源[/color]。\n宽度 = 32 × (2 + 环等级)，等级由你攒的经验决定。\n\n[font=default-bold]十二种经验[/font]\n12 种科技瓶各记一笔账，各自取 [color=yellow]log10[/color] 再相加成等级。\n缺一种，那一项就是 [color=red]0[/color]——想升级，五个星球都得跑到。\n\n[font=default-bold]关联箱[/font]\n把[color=yellow]木箱[/color]放到公共世界，它就变成关联箱，直通你环中央的 [color=acid]12 个收货箱[/color]（共用同一份库存，开 12 个只是为了让机械臂能并行取货）。\n箱子[color=red]不能打开[/color]，得靠机械臂搬空。\n\n[font=default-bold]公共世界[/font]\n[color=acid]Nauvis / Vulcanus / Gleba / Fulgora / Aquilo[/color] 五个星球各自定期重置，错峰进行。\n重置时那颗星球上的一切[color=red]清空[/color]，包括你留在那里的东西。\n\n[font=default-bold]科技漏水[/font]\n已研究的科技会周期性地被撤销，概率 = k × 该科技的瓶子种数 %。\n科技越深越容易漏——水位由全服产能决定，不是由某个数字封顶。\n\n[font=default-bold]离线的代价[/font]\n离线 [color=yellow]30 小时[/color]，你的戴森环变成[color=acid]公共资产[/color]：任何人可进、可拆、可搬空，12 个收货箱切到全服公共库存。\n离线 [color=red]50 小时[/color]，环被删除。\n但[color=acid]经验一点不丢[/color]，回来后环会按原宽度重新长出来。\n\n[font=default-bold]体力[/font]\n随时间恢复，离线也在攒，攒满不再涨。兑换经验要花体力，是唯一的门票。\n\n[font=default-bold]管理员[/font]\n/ring-delete <玩家名> 可以手动删除一个离线玩家的戴森环，效果等同离线 50 小时。
