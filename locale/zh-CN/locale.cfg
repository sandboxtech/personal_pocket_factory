description=\n[color=acid]《戴森环计划》[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]你的环[/font]\n每人一条[color=acid]专属戴森环[/color]，只有你能进，但[color=red]一颗矿都没有[/color]。\n攒经验，环跟着变长。\n\n[img=item/linked-chest] [font=default-large-bold]关联箱[/font]\n手搓的木箱直接就是[color=acid]关联箱[/color]。放到外面当投递口，货直通环里的收货箱。\n矿不用背，[color=yellow]机械臂[/color]往里塞就行。\n\n[img=space-location/nauvis] [font=default-large-bold]外面会重置[/font]\n五个星球轮着清空，一到点[color=red]全没[/color]，[color=red]全服还会随机掉科技[/color]。\n多产多研究，科技才留得住。\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]太久不上线[/font]\n环先转成[color=acid]公共的[/color]任人进出，再久一点直接回收。\n但[color=acid]经验一点不少[/color]，回来照样长出来。\n\n\n版本号 0.2.0\n项目地址 https://github.com/sandboxtech/personal_pocket_factory
scenario-name=[color=acid]戴森环计划[/color]
[pw]
