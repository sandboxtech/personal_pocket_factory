# ══ /pw-config 里每个配置项的一句话说明 ══
# 字段名 -> pw.cfg-<字段名，下划线换成短横>。清单本身在 constants.TUNABLES /
# TUNABLE_TABLES，那张表同时也是 ensure_defaults 的数据源，说明和默认值不会各说各话。
cfg-group-stamina=体力
cfg-group-ring=戴森环形状
cfg-group-lifecycle=戴森环生命周期
cfg-group-world=公共世界
cfg-group-ship=飞船
cfg-group-cycle=周期调度
cfg-group-tech=科技漏水
cfg-group-misc=其它
cfg-stamina-ticks-per-point=攒 1 点体力要多少 tick（60 = 每秒 1 点）
cfg-stamina-pending-cap=可领取池上限（点），攒满就不再涨
cfg-stamina-balance-cap=体力池上限（点）
cfg-stamina-initial-multiple=新人初始体力 = 可领取上限的几倍（0 = 不送）
cfg-ring-height=环带总高（格），同时是引擎的 map_gen 硬边界
cfg-ring-concrete-height=中间可建带高度，其余均分给上下临空带
cfg-ring-base-half-width=半宽下限（格）。宽度下限是它的两倍
cfg-ring-per-level=每升一级两侧各外推多少格
cfg-ring-public-hours=离线多久后戴森环变公共（老玩家上限）
cfg-ring-delete-hours=离线多久后删除戴森环（老玩家上限）
cfg-ring-min-hours=上面两个阈值按在线时长缩放后的下限
cfg-public-size=公共星球的边长（格），引擎硬边界
cfg-world-reset-offset-minutes=相邻星球首次排期错开多少分钟
cfg-ship-life-hours=飞船寿命（小时），到点销毁
cfg-ship-height=飞船表面高度硬边界
cfg-ship-home-planet=新飞船默认环绕哪颗星球
cfg-ship-lock-native-creation=禁止玩家自己建船和删船，UI 是唯一入口（同时关按钮和禁权限动作）
cfg-cycle-minutes=周期任务的周期（分钟）
cfg-cycle-phase-minutes=各类周期任务之间错开多少分钟
cfg-cycle-base-offset-minutes=周期任务整体偏移，用来避开星球重置时刻
cfg-hud-refresh-ticks=HUD 自动刷新间隔（tick）
cfg-tech-loss-k=科技被撤销的概率系数：概率% = 瓶子种数 × 它
cfg-detail-hours=老玩家门槛（累计在线小时），决定谁看得到详细数值
cfg-block-blueprint-library=是否禁用蓝图库
cfg-debug=调试播报
cfg-world-reset-minutes=每个星球的重置周期（分钟），按星球名索引
cfg-quality-exp=各品质的经验倍率
cfg-ring-tiles=环带四种语义位置各铺什么砖
cfg-world-patch-tiles=各星球可用于地貌斑块替换的地块名单
# ══ /pw-config ══
cmd-config-help=列出所有可热改的参数：当前值、说明、以及照抄就能用的 /sc 语句。可带关键词过滤
# ══ 配置总览窗口（/pw-config，见 scripts/gui/config.lua） ══
cfg-title=[img=virtual-signal/signal-info] 参数总览
cfg-head=改法：[color=yellow]/sc storage.名字 = 新值[/color]。\n[color=green]绿色[/color]的改完立刻全服生效，[color=yellow]黄色[/color]的要等特定时机，[color=gray]灰色[/color]的目前不起作用。
cmd-config-console=这条指令要在游戏里执行，服务器控制台开不了窗口
# 生效范围徽标 + 悬停说明
cfg-applies-live=立即
cfg-applies-live-tip=改完立刻对所有人生效，每次用到都是现读的，不缓存。
cfg-applies-grow=立即（只增）
cfg-applies-grow-tip=立刻重算，但环只会变长不会变窄。调小了要等环被回收重建才看得出来。
cfg-applies-repaint=新地块
cfg-applies-repaint-tip=只影响之后新涂的砖。已经铺好的地不会重涂。
cfg-applies-reset=下次重置
cfg-applies-reset-tip=要等那个世界下一轮重置时才套用。
cfg-applies-new=仅新建
cfg-applies-new-tip=只对之后新建的东西生效，已经存在的不受影响。
cfg-applies-dead=无效
cfg-applies-dead-tip=目前这个值不起任何作用。留着是为了不假装它能用。
ship-scuttled=[color=yellow]__1__[/color] 拆掉了自己的飞船
overview-scuttle=拆掉飞船
overview-scuttle-tip=把你自己的飞船拆掉。\n[color=red]船上的所有东西都会跟着消失，而且无法撤销。[/color]\n每人同时只能有一艘飞船，想换一艘就得先拆掉现在这艘。\n点一下之后按钮会变成确认状态，再点一次才真的执行。
overview-scuttle-confirm=[color=red]确认拆掉[/color]
overview-scuttle-confirm-tip=[color=red]再点一次就会立刻拆掉这艘飞船。[/color]\n船上的所有东西都会跟着消失。\n不想拆的话，等十秒钟按钮就会自己恢复原状。
cfg-ring-pond-half=环心浅水池的半径（格）。0 表示不生成水池
cfg-world-resource-boost=公共世界的矿脉倍率：面积 / 密度 / 单格矿量
travel-convert-timer=[color=acid]大约 __1__ 分钟后自动兑换一次收货箱里的科技瓶[/color]
