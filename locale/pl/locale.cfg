console-label=konsola serwera
help-title=Jak grać
help-body=[font=default-bold]Twój pierścień[/font]\nJeden na gracza, wejść możesz tylko ty, i [color=acid]nigdy się nie resetuje[/color]. Nie ma w nim [color=red]żadnych złóż[/color], a pośrodku leży mały płytki staw.\n\n[font=default-bold]Dwanaście rodzajów doświadczenia[/font]\n12 rodzajów fiolek liczy się osobno. Fiolka daje tyle poziomów, ile [color=yellow]cyfr[/color] ma jej doświadczenie, a wszystkie 12 sumuje się w poziom łączny.\nSzerokość pierścienia = (poziom łączny + 2) x 32 kafle. Szerokość statku = (poziom łączny + 4) x 16 kafli.\n\n[font=default-bold]Powiązane skrzynie[/font]\nDrewniana skrzynia zrobiona ręcznie od razu wychodzi jako [color=acid]powiązana skrzynia[/color]. Postawiona poza pierścieniem staje się punktem odbioru, a jej zawartość trafia prosto do skrzyń odbiorczych w pierścieniu.\n[color=red]W całym wszechświecie może istnieć tylko jedna[/color]: postawienie nowej zwraca starą do ekwipunku.\nSkrzyń [color=red]nie da się otworzyć ręcznie[/color]; wszystko wkładają i wyjmują chwytaki.\n\n[font=default-bold]Światy publiczne[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] mają własne okresy resetu. Po jego upływie cała planeta zostaje [color=red]wyczyszczona[/color].
help-body-veteran=[font=default-bold]Energia i zamiana[/font]\nEnergia odnawia się po 1 na sekundę, także offline, i zatrzymuje się na limicie. 1 energii zamienia 1 fiolkę.\nZamiana ręczna znajduje się w „Moim pierścieniu" i korzysta z ekwipunku; automatyczna przebiega raz na minutę i korzysta ze skrzyń odbiorczych. Obie czerpią z tego samego zapasu.\n\n[font=default-bold]Wyciek technologii[/font]\nZbadane technologie są okresowo cofane; szansa rośnie wraz z liczbą rodzajów fiolek, których technologia wymaga. Badania poziomowe spadają o jeden poziom zamiast zerować się.\n\n[font=default-bold]Dłuższa nieobecność[/font]\nPo odpowiednio długiej nieobecności pierścień staje się publiczny, otwarty na wejście i rozbiórkę; jeszcze dłużej i zostaje uprzątnięty. Doświadczenie pozostaje nietknięte.
help-body-detail=[font=default-bold]Dokładne liczby[/font]\nCykle resetu: [planet=nauvis] __1__ min, [planet=vulcanus] __2__ min, [planet=gleba] __3__ min, [planet=fulgora] __4__ min, [planet=aquilo] __5__ min.\nSzansa na cofnięcie technologii w procentach to mniej więcej liczba wymaganych przez nią rodzajów fiolek × __6__.\nPo __7__ godz. offline pierścień staje się publiczny i otwiera się dla wszystkich; po __8__ godz. zostaje uprzątnięty, ale doświadczenie nigdy nie przepada.
btn-overview-tip=[font=default-bold]Serwer[/font]\nPierścienie i statki wszystkich graczy.\nGdy kogoś nie ma wystarczająco długo, można wejść do jego pierścienia. Własny statek też buduje się tutaj.
