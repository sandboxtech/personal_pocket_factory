console-label=konsola serwera
help-title=Jak grać
help-body=[font=default-bold]Główna pętla[/font]\nTwój [color=acid]pierścień nigdy się nie resetuje[/color]: to, co tu uzbierasz, zostaje.\n[color=yellow]Pięć światów zewnętrznych jest co jakiś czas czyszczonych[/color], a to, co tam zostawisz, znika razem z nimi.\nStąd rytm: zbierasz na planecie, odsyłasz łup do pierścienia powiązaną skrzynią, a w domu przetwarzasz i zbierasz doświadczenie.\nDoświadczenie poszerza pierścień i to [color=acid]jedyny trwały rozwój[/color] w tej grze.\n\n[font=default-bold]Twój pierścień[/font]\nKawałek terenu, na który możesz wejść tylko ty. [color=red]Żadnych surowców[/color], wszystko trzeba przywieźć z zewnątrz.\n\n[font=default-bold]Dwanaście rodzajów doświadczenia[/font]\n12 rodzajów fiolek liczy się osobno: z każdego bierze się [color=yellow]liczbę cyfr[/color], a suma wszystkich dwunastu to twój poziom.\n1 punkt daje 1 poziom, a potem każde dziesięciokrotne zwiększenie dokłada kolejny.\nRodzaj, którego w ogóle nie masz, liczy się jako [color=red]0[/color], więc trzeba odwiedzić wszystkie pięć planet.\n\n[font=default-bold]Powiązane skrzynie[/font]\nGdy [color=yellow]zrobisz drewnianą skrzynię ręcznie[/color], wychodzi z tego [color=acid]powiązana skrzynia[/color] (te z montowni zamieniają się przy stawianiu).\nPostaw jedną na zewnątrz jako [color=acid]punkt odbioru[/color], a wszystko, co do niej trafi, poleci prosto do skrzyń odbiorczych w pierścieniu.\n[color=red]Tylko jedna w całym wszechświecie[/color]: postawienie nowej usuwa starą, więc miejsce to prawdziwa decyzja.\n[color=red]Nikt nie otworzy jej ręcznie[/color], wszystko wkładają i wyjmują chwytaki.\n\n[font=default-bold]Automatyczna zamiana[/font]\nFiolki w skrzyniach odbiorczych [color=acid]same zamieniają się w doświadczenie[/color], co jakiś czas, nawet gdy jesteś offline.\nChcesz zachować część na badania? Wyjmij je wcześniej chwytakami. [color=yellow]Wyścig z automatem[/color] też jest częścią gry.\n\n[font=default-bold]Pięć światów zewnętrznych[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] resetują się po kolei.\nZ tej, na którą przyjdzie kolej, [color=red]znika wszystko[/color], łącznie z tym, co tam zostawiłeś.
help-body-veteran=[font=default-bold]Wyciek technologii[/font]\nZbadane technologie bywają co jakiś czas cofane, a im głębiej w drzewku, tym szybciej wyciekają. Badania poziomowe nie spadają do zera, tylko o jeden poziom.\nPozostaje produkować i badać więcej, żeby nadrobić straty.\n\n[font=default-bold]Energia[/font]\nRośnie sama, nawet offline, i zatrzymuje się na limicie. Zamiana kosztuje energię i to jedyny bilet wstępu.\n\n[font=default-bold]Długa nieobecność[/font]\nTwój pierścień najpierw staje się [color=acid]publiczny[/color]: każdy może wejść, rozebrać go i opróżnić.\nPrzy dłuższej nieobecności zostaje uprzątnięty.\nAle [color=acid]doświadczenie nie przepada[/color]: gdy wrócisz, pierścień odrośnie.
help-body-detail=[font=default-bold]Dokładne liczby[/font]\nCykle resetu: [planet=nauvis] __1__ min, [planet=vulcanus] __2__ min, [planet=gleba] __3__ min, [planet=fulgora] __4__ min, [planet=aquilo] __5__ min.\nSzansa na cofnięcie technologii w procentach to mniej więcej liczba wymaganych przez nią rodzajów fiolek × __6__.\nPo __7__ godz. offline pierścień staje się publiczny i otwiera się dla wszystkich; po __8__ godz. zostaje uprzątnięty, ale doświadczenie nigdy nie przepada.
btn-overview-tip=[font=default-bold]Serwer[/font]\nPierścienie i statki wszystkich graczy.\nGdy kogoś nie ma wystarczająco długo, można wejść do jego pierścienia. Własny statek też buduje się tutaj.
