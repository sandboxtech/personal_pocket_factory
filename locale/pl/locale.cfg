description=\n[color=acid]Projekt Pierścień Dysona[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]Twój pierścień[/font]\nKażdy dostaje [color=acid]własny pierścień[/color]: wejść możesz tylko ty, ale [color=red]nie ma tam żadnych surowców[/color].\nZbieraj doświadczenie, a pierścień będzie się poszerzał.\n\n[img=item/linked-chest] [font=default-large-bold]Powiązane skrzynie[/font]\nDrewniana skrzynia zrobiona ręcznie od razu jest [color=acid]powiązaną skrzynią[/color]. Postaw ją na zewnątrz jako punkt odbioru, a wszystko, co do niej trafi, poleci prosto do skrzyń odbiorczych w twoim pierścieniu.\nRudy nie musisz już nosić, wystarczą [color=yellow]chwytaki[/color].\n\n[img=space-location/nauvis] [font=default-large-bold]Światy zewnętrzne się resetują[/font]\nPięć planet resetuje się po kolei: gdy przyjdzie pora, [color=red]znika stamtąd wszystko[/color], a serwer [color=red]losowo traci zbadane technologie[/color].\nTylko ci, którzy nie przestają produkować i badać, utrzymają swoje technologie.\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]Długa nieobecność[/font]\nTwój pierścień najpierw staje się [color=acid]publiczny[/color] i otwiera się dla wszystkich, a przy dłuższej nieobecności zostaje uprzątnięty.\nAle [color=acid]doświadczenie nie przepada[/color]: gdy wrócisz, pierścień odrośnie na tę samą szerokość.\n\n\nWersja 0.2.0\nProjekt https://github.com/sandboxtech/personal_pocket_factory
