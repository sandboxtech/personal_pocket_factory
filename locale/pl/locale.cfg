overview-scuttle-tip=Niszczy twój własny statek.\n[color=red]Wszystko, co jest na pokładzie, przepada razem z nim, i nie da się tego cofnąć.[/color]\nNaraz można mieć tylko jeden statek, więc rozbiórka robi miejsce na nowy.\nPierwsze kliknięcie uzbraja przycisk, drugie wykonuje operację.
