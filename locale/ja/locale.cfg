console-label=サーバーコンソール
help-title=遊び方
help-body=[font=default-bold]あなたのリング[/font]\n一人にひとつ、入れるのは自分だけ。[color=acid]惑星と一緒に消去されることはなく[/color]、たまにログインしていればずっとあなたのものです。失うのは長く来なかったときだけ。[color=red]鉱石は一切なく[/color]、中心に小さな浅瀬があり、四方の岸すべてに汲み上げポンプを置けます。\nここは[color=acid]常に昼[/color]なので、蓄電池なしでもソーラーパネルだけで夜を越せます。\n\n[font=default-bold]死んだときは[/font]\nどこで倒れても自分のリングで復活します。[color=red]死体と持ち物は倒れた場所に残り[/color]、その惑星がリセットされると一緒に消えます。\n装備一式は[color=yellow]__2__ 時間に 1 回まで[/color]支給されます（モジュラーアーマー、携帯ロボットステーション、ソーラーパネル、建設ロボット）。続けて死んでも 2 セット目は出ません。\n\n[font=default-bold]12 種類の経験値[/font]\n12 種の科学パックは別々に記録されます。各経験値の[color=yellow]桁数[/color]がそのレベルで、12 項の合計が総レベルです。\nリング幅 =（総レベル + 2）× 32 タイル。船の幅 =（総レベル + 4）× 16 タイル。\n\n[font=default-bold]リンクチェスト[/font]\n手作業で作った木の箱はそのまま[color=acid]リンクチェスト[/color]になります。リング外に置けば集荷ポイントとなり、中身はリングの受取チェストへ直行します。\n[color=red]宇宙全体で同時に __1__ 個まで[/color]。それを超えて置くと、いちばん古いものがインベントリに戻ります。\n箱は[color=red]手で開けられません[/color]。出し入れはインサーターで行います。\n\n[font=default-bold]公共惑星[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] はそれぞれ独自のリセット周期を持ちます。時間が来ると惑星全体が[color=red]消去[/color]されます。\n消去前には惑星上にいる人へ予告が出ます。見たら集荷ポイントに荷を詰めて撤収してください。
help-body-veteran=[font=default-bold]スタミナと変換[/font]\nスタミナは毎秒 1 回復し、オフラインでも増え、上限で止まります。スタミナ 1 で科学パック 1 個を変換します。\n手動変換は「マイリング」内でインベントリを対象に、自動変換は受取チェストを対象に、オンライン中は __1__ 分ごと、オフライン中は __2__ 分ごとに行われます。両者は同じスタミナを消費します。\n\n[font=default-bold]技術流出[/font]\n研究済みの技術が定期的に取り消されます。確率はその技術が必要とするパックの種類数とともに上がります。レベル制の研究は 0 に戻らず 1 段階下がります。\n\n[font=default-bold]長期不在[/font]\n一定期間ログインしないとリングは公共になり、誰でも入って解体できます。さらに放置すると回収されます。経験値は影響を受けません。
help-body-detail=[font=default-bold]具体的な数値[/font]\n惑星のリセット周期：[planet=nauvis] __1__ 分、[planet=vulcanus] __2__ 分、[planet=gleba] __3__ 分、[planet=fulgora] __4__ 分、[planet=aquilo] __5__ 分。\n漏れの判定は毎回 0～__6__ の係数をひとつ引きます。その回に技術が取り消される確率（％）は、必要な科学パックの種類数 × その係数です。\nオフライン __7__ 時間でリングは公共になり誰でも入れるようになります。__8__ 時間で回収されますが、経験値は失われません。 この 2 つのしきい値は累計プレイ時間に応じて伸び、上の数値は熟練者の上限です。始めたばかりなら最短で __9__ 時間で公共、__10__ 時間で削除されます。\n消去前の予告タイミング：__11__ 分前。
