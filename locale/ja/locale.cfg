cfg-ring-public-hours=何時間オフラインでリングが公共になるか（熟練者の上限）
cfg-ring-delete-multiple=削除しきい値は公共化しきい値の何倍か（3 なら 3 時間→9 時間、30 時間→90 時間）
cfg-ring-min-hours=プレイ時間で縮小した後の、上記2つの下限
cfg-ring-hide-private=個人のリングを遠隔ビューの平面リストから隠すか。公共のリングは常に表示。false にすると個人のリングも遠隔から見て解体できます
cfg-public-size=公共惑星の一辺（タイル）。マップ境界
cfg-dropoff-limit=1 人が同時に置ける集荷ポイントの数（宇宙全体）。超えた分はいちばん古いものがインベントリに戻ります
cfg-world-climate-swing=各ラウンドの気候の振れ幅（Nauvis のみ）。惑星全体の乾湿と赤い砂漠の傾向をずらします。0 なら毎回同じ気候になります
cfg-world-terrain-scale=地形の塊の大きさ（Nauvis のみ）。小さいほど一つの塊が大きくなります。水の頻度も兼ねるため、下げると湖は少なく大きくなります
cfg-world-reset-offset-minutes=隣り合う惑星の初回スケジュールをずらす分数
cfg-ship-life-hours=船の寿命（時間）。過ぎると破棄されます
cfg-ship-height=船の高さの境界（タイル）
cfg-ship-home-planet=新しい船が既定で周回する惑星
cfg-ship-lock-native-creation=プレイヤーが自分で船を作成・削除するのを禁止し、UI を唯一の入口にします（ボタンを無効化し、入力アクションも遮断）
cfg-cycle-minutes=定期タスクの周期（分）
cfg-cycle-phase-minutes=各定期タスクをずらす分数
cfg-cycle-base-offset-minutes=定期タスク全体のオフセット。惑星リセットとの衝突回避用
cfg-hud-refresh-ticks=画面表示の自動更新間隔（ゲーム内ティック）
cfg-tech-loss-k-max=漏れ係数の上限：毎回 0～この値をランダムに引く。確率% = 必要パック種類数 × その係数
cfg-detail-hours=熟練者の基準（累計プレイ時間）。詳細な数値を見せる条件
cfg-starter-equipment-hours=リスポーン時に初期装備を再配布するまでのクールダウン（時間）
cfg-block-blueprint-library=設計図ライブラリを無効化するか
cfg-debug=デバッグメッセージ
cfg-world-reset-minutes=惑星ごとのリセット周期（分）。惑星名がキー
cfg-world-warn-minutes=リセットの何分前に惑星上のプレイヤーへ警告するか（配列、複数段階を指定可）
cfg-quality-exp=品質ごとの経験値倍率
cfg-starter-items=新規プレイヤーの初期装備。テーブルごと差し替えます（{} なら何も配りません）。存在しないアイテム名は無視されます
cfg-starter-equipment=初期装備の一覧。装備グリッドを持つアーマーを先頭に置くと、以降のモジュールはそのグリッドに挿入されます。テーブルごと差し替えます
cfg-ring-tiles=リングの4区画それぞれに敷くタイル
cmd-config-help=パラメータウィンドウを開きます：変更可能な値、変更がいつ効くか、その意味
cfg-title=[img=virtual-signal/signal-info] パラメータ一覧
cfg-head=コンソールに入力：[color=yellow]/sc storage.名前 = 値[/color]。\n[color=green]緑[/color]は即座に全体へ反映、[color=yellow]黄[/color]は特定のタイミング待ち、[color=gray]灰[/color]は現在無効です。
cmd-config-console=このコマンドはゲーム内で実行してください。サーバーコンソールではウィンドウを開けません
cfg-applies-live=即時
cfg-applies-live-tip=変更後すぐ全員に反映されます。使うたびに読み直すのでキャッシュされません。
cfg-applies-grow=即時（拡大のみ）
cfg-applies-grow-tip=すぐ再計算されますが、リングは広がるだけで狭くはなりません。縮小は再生成後に反映されます。
cfg-applies-repaint=新規タイル
cfg-applies-repaint-tip=以後に敷くタイルにのみ影響します。既に敷かれた地面は塗り直されません。
cfg-applies-reset=次のリセット
cfg-applies-reset-tip=その世界が次にリセットされるときに適用されます。
cfg-applies-new=新規のみ
cfg-applies-new-tip=以後に作られるものにのみ影響します。既存のものは変わりません。
cfg-applies-dead=無効
cfg-applies-dead-tip=この値は現在何の効果もありません。動くふりをしないために残してあります。
ship-scuttled=[color=yellow]__1__[/color] が自分の船を解体しました
overview-scuttle=船を解体
overview-scuttle-tip=自分の船を解体します。\n[color=red]船に積んだものはすべて一緒に消え、取り消しはできません。[/color]\n船は同時に 1 隻までなので、新しく作るにはまず今の船を解体します。\n1 回目のクリックで確認状態になり、2 回目で実行されます。
overview-scuttle-confirm=[color=red]解体を確認[/color]
overview-scuttle-confirm-tip=[color=red]もう一度押すとこの船をすぐ解体します。[/color]\n積んでいるものもすべて消えます。\nやめる場合は 10 秒待てばボタンが元に戻ります。
cfg-ring-pond-half=リング中心の浅瀬の半径（タイル）。0 なら池を作りません
cfg-ring-always-day=リングを常時昼にするか。有効なら太陽光パネルが常に最大出力で動き、蓄電池が不要になります
cfg-world-resource-boost=公共惑星の鉱脈倍率：面積 / 密度 / 1 マスあたりの埋蔵量
ring-deleted-by-admin=[color=red]管理者 __1__ があなたのリングを削除しました[/color]。経験値は減っていないので、リングボタンを押せば同じ幅で生え直します。
cfg-ring-level-bonus=ボーナスのレベル数。幅 = 1 レベルあたり × (合計レベル + この値)、つまり 32 ×（レベル + 2）
cfg-ship-width-per-level=船が 1 レベルごとに広がるタイル数
cfg-ship-width-bonus=船のボーナスレベル数。幅 = 1 レベルあたり ×（レベル + この値）、つまり 16 ×（4 + レベル）
travel-convert-rate=[color=acid]受取チェストの科学パックは __1__ 分ごとに自動変換されます[/color]。手動変換と同じスタミナを消費します。研究用に残したいものは次の変換までに抜き出してください。
cfg-auto-convert-minutes=オンラインのプレイヤーの自動変換周期（分）
cfg-auto-convert-offline-minutes=オフラインのプレイヤーの自動変換周期（分）。オンラインより間隔が長い
