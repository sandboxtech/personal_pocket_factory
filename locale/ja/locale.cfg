description=\n[color=acid]ダイソンリング計画[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]あなたのリング[/font]\n一人にひとつ、[color=acid]自分専用のリング[/color]。入れるのは自分だけですが、[color=red]資源はひとつもありません[/color]。\n経験値を貯めると、リングが広がります。\n\n[img=item/linked-chest] [font=default-large-bold]リンクチェスト[/font]\n手作業で作った木の箱は、そのまま[color=acid]リンクチェスト[/color]になります。外の惑星に置けば集荷ポイントになり、中身はリングの受取チェストに直行。\n鉱石を担いで運ぶ必要はありません。[color=yellow]インサータ[/color]で放り込むだけです。\n\n[img=space-location/nauvis] [font=default-large-bold]外の世界はリセットされる[/font]\n5つの惑星が順番にリセットされ、時間が来れば[color=red]すべて消えます[/color]。[color=red]サーバー全体で研究済みの技術もランダムに失われます[/color]。\n生産と研究を止めなければ、技術は残ります。\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]長期間ログインしないと[/font]\nリングはまず[color=acid]公共[/color]になって誰でも出入りできるようになり、さらに放置すると回収されます。\nただし[color=acid]経験値は一切減りません[/color]。戻ってくれば同じ幅で生え直します。\n\n\nバージョン 0.2.0\nプロジェクト https://github.com/sandboxtech/personal_pocket_factory\nQQ グループ 293280221
