console-label=サーバーコンソール
help-title=遊び方
help-body=[font=default-bold]基本の流れ[/font]\nあなたの[color=acid]リングはリセットされません[/color]。ここに貯めたものはずっと残ります。\n[color=yellow]外の5惑星は定期的に消えます[/color]。置いてきたものも一緒に消えます。\nだから流れはこう：惑星で採掘 → リンクチェストでリングへ送る → リングで加工して経験値を貯める。\n経験値でリングが広がり、[color=acid]永続的な成長はこれだけ[/color]です。\n\n[font=default-bold]あなたのリング[/font]\n入れるのは自分だけ。[color=red]資源はひとつもなく[/color]、すべて外から運びます。\n\n[font=default-bold]12種類の経験値[/font]\n12種の科学パックが別々に記録され、それぞれの[color=yellow]桁数[/color]を12個足したものがレベルです。\n1 貯めれば 1、以降 10 倍ごとに 1 増えます。\nひとつも貯めていない種類は [color=red]0[/color]。だから5惑星すべてを回る必要があります。\n\n[font=default-bold]リンクチェスト[/font]\n[color=yellow]手作業で木の箱を作る[/color]と、出てくるのは[color=acid]リンクチェスト[/color]です（組立機製の木箱も設置時に変わります）。\n外に置けば[color=acid]集荷ポイント[/color]になり、入れた荷物はリングの受取チェストへ直行します。\n[color=red]宇宙全体でひとつだけ[/color]。新しく置くと古い方は消えるので、どこに置くかは重要な判断です。\n箱は[color=red]誰も手で開けられません[/color]。出し入れはインサータで。\n\n[font=default-bold]自動変換[/font]\n受取チェストの科学パックは[color=acid]定期的に自動で経験値になります[/color]。オフラインでも進みます。\n研究に使いたいなら早めにインサータで抜き出すこと。[color=yellow]自動変換との取り合い[/color]もこのゲームの一部です。\n\n[font=default-bold]外の5惑星[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] が順番にリセットされます。\n順番が来た惑星は[color=red]すべて消え[/color]、置いてきたものも同じです。
help-body-veteran=[font=default-bold]技術流出[/font]\n研究済みの技術がときどき取り消されます。ツリーの奥ほど流出が速くなります。レベル制の研究は 0 に戻らず、1 段階下がるだけです。\n生産と研究を続けて、失った分を取り戻すしかありません。\n\n[font=default-bold]スタミナ[/font]\n自動で増え、オフラインでも増え、上限で止まります。経験値への変換にはスタミナが要ります。必要なのはそれだけです。\n\n[font=default-bold]長期間ログインしないと[/font]\nリングはまず[color=acid]公共[/color]になり、誰でも入って解体・搬出できるようになります。\nさらに放置すると回収されます。\nただし[color=acid]経験値は一切減りません[/color]。戻ってくれば生え直します。
help-body-detail=[font=default-bold]具体的な数値[/font]\n惑星のリセット周期：[planet=nauvis] __1__ 分、[planet=vulcanus] __2__ 分、[planet=gleba] __3__ 分、[planet=fulgora] __4__ 分、[planet=aquilo] __5__ 分。\n技術が取り消される確率（％）は、その技術に必要な科学パックの種類数 × __6__ 程度です。\nオフライン __7__ 時間でリングは公共になり誰でも入れるようになります。__8__ 時間で回収されますが、経験値は失われません。
btn-overview-tip=[font=default-bold]サーバー[/font]\n全員のリングと宇宙船の一覧。\n誰かが十分に長く不在なら、そのリングに入れます。自分の船もここで作ります。
