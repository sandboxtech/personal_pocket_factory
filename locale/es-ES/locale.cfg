console-label=consola del servidor
help-title=Cómo se juega
help-body=[font=default-bold]El bucle principal[/font]\nTu [color=acid]anillo nunca se reinicia[/color]: lo que acumules aquí se queda.\n[color=yellow]Los cinco mundos exteriores se vacían cada cierto tiempo[/color] y lo que dejes allí desaparece con ellos.\nDe ahí el ritmo: recolectar en un planeta, mandarlo al anillo con un cofre enlazado, y en casa procesarlo y acumular experiencia.\nLa experiencia ensancha el anillo, y es [color=acid]el único crecimiento permanente[/color] del juego.\n\n[font=default-bold]Tu anillo[/font]\nUn terreno donde solo entras tú. [color=red]Sin ningún recurso[/color]: todo viene de fuera.\n\n[font=default-bold]Doce clases de experiencia[/font]\nLos 12 frascos se cuentan por separado: de cada uno se toma su [color=yellow]número de cifras[/color], y la suma de los 12 es tu nivel.\n1 punto vale 1 nivel, y a partir de ahí cada multiplicación por diez suma otro.\nUna clase de la que no tengas nada cuenta [color=red]0[/color], así que hay que visitar los cinco planetas.\n\n[font=default-bold]Cofres enlazados[/font]\nSi [color=yellow]fabricas un cofre de madera a mano[/color], lo que sale es un [color=acid]cofre enlazado[/color] (los del ensamblador se convierten al colocarlos).\nPon uno fuera como [color=acid]punto de entrega[/color] y todo lo que metas irá directo a los cofres de recepción de tu anillo.\n[color=red]Solo uno en todo el universo[/color]: al poner uno nuevo desaparece el anterior, así que dónde ponerlo es una decisión de verdad.\n[color=red]Nadie puede abrirlos a mano[/color]: todo entra y sale con brazos mecánicos.\n\n[font=default-bold]Conversión automática[/font]\nLos frascos de tus cofres de recepción [color=acid]se convierten solos en experiencia[/color], cada cierto tiempo, incluso desconectado.\n¿Quieres guardar algunos para investigar? Sácalos antes con brazos mecánicos. [color=yellow]Competir con la conversión automática[/color] es parte del juego.\n\n[font=default-bold]Los cinco mundos exteriores[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] se reinician por turnos.\nAl que le toca se le [color=red]borra todo[/color], incluido lo que hayas dejado allí.
help-body-veteran=[font=default-bold]Fuga tecnológica[/font]\nLas tecnologías ya investigadas se anulan de vez en cuando, y cuanto más adentro del árbol, más rápido se pierden. Las investigaciones por niveles no se van a cero: bajan un nivel.\nSolo queda producir e investigar más para compensarlo.\n\n[font=default-bold]Energía[/font]\nSube sola, incluso desconectado, y se detiene en el tope. Convertir cuesta energía; es el único requisito.\n\n[font=default-bold]Ausencia prolongada[/font]\nTu anillo pasa primero a ser [color=acid]público[/color]: cualquiera puede entrar, desmontarlo y vaciarlo.\nSi la ausencia se alarga, se retira.\nPero tu [color=acid]experiencia no se pierde[/color]: al volver, el anillo crece otra vez.
help-body-detail=[font=default-bold]Las cifras exactas[/font]\nCiclos de reinicio: [planet=nauvis] __1__ min, [planet=vulcanus] __2__ min, [planet=gleba] __3__ min, [planet=fulgora] __4__ min, [planet=aquilo] __5__ min.\nLa probabilidad de que una tecnología se anule, en porcentaje, es aproximadamente su número de clases de frascos × __6__.\nTras __7__ h desconectado tu anillo se hace público y queda abierto a todos; tras __8__ h se retira, aunque la experiencia nunca se pierde.
btn-overview-tip=[font=default-bold]Servidor[/font]\nLos anillos y las naves de todo el mundo.\nCuando alguien lleva bastante tiempo fuera, puedes entrar en su anillo. Tu propia nave también se construye aquí.
