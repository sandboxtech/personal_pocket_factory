console-label=consola del servidor
help-title=Cómo se juega
help-body=[font=default-bold]Tu anillo[/font]\nUno por jugador, solo tú puedes entrar, y [color=acid]nunca se reinicia[/color]. No contiene [color=red]ningún mineral[/color] y en su centro hay un pequeño estanque poco profundo.\n\n[font=default-bold]Doce clases de experiencia[/font]\nLos 12 frascos se cuentan por separado. Un frasco aporta tantos niveles como [color=yellow]cifras[/color] tenga su experiencia, y los 12 suman tu nivel total.\nAnchura del anillo = (nivel total + 2) x 32 casillas. Anchura de la nave = (nivel total + 4) x 16 casillas.\n\n[font=default-bold]Cofres enlazados[/font]\nUn cofre de madera fabricado a mano sale directamente como [color=acid]cofre enlazado[/color]. Colocado fuera de tu anillo se convierte en punto de entrega, y su contenido va directo a los cofres de recepción del anillo.\n[color=red]Solo puede existir uno en todo el universo[/color]: al poner uno nuevo, el anterior vuelve a tu inventario.\nLos cofres [color=red]no se abren a mano[/color]; todo entra y sale con brazos mecánicos.\n\n[font=default-bold]Mundos públicos[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] tienen cada uno su propio ciclo de reinicio. Al cumplirse, el planeta entero se [color=red]borra[/color].
help-body-veteran=[font=default-bold]Energía y conversión[/font]\nLa energía se recupera a 1 por segundo, también desconectado, y se detiene en el tope. 1 de energía convierte 1 frasco.\nLa conversión manual está en «Mi anillo» y usa tu inventario; la automática pasa una vez por minuto y usa los cofres de recepción. Ambas gastan la misma reserva.\n\n[font=default-bold]Fuga tecnológica[/font]\nLas tecnologías investigadas se anulan periódicamente; la probabilidad sube con el número de clases de frascos que exige la tecnología. Las investigaciones por niveles bajan un nivel en vez de ponerse a cero.\n\n[font=default-bold]Ausencia prolongada[/font]\nSi no te conectas durante bastante tiempo, tu anillo pasa a ser público y cualquiera puede entrar y desmontarlo; más tiempo aún y se retira. La experiencia no se ve afectada.
help-body-detail=[font=default-bold]Las cifras exactas[/font]\nCiclos de reinicio: [planet=nauvis] __1__ min, [planet=vulcanus] __2__ min, [planet=gleba] __3__ min, [planet=fulgora] __4__ min, [planet=aquilo] __5__ min.\nLa probabilidad de que una tecnología se anule, en porcentaje, es aproximadamente su número de clases de frascos × __6__.\nTras __7__ h desconectado tu anillo se hace público y queda abierto a todos; tras __8__ h se retira, aunque la experiencia nunca se pierde.
btn-overview-tip=[font=default-bold]Servidor[/font]\nLos anillos y las naves de todo el mundo.\nCuando alguien lleva bastante tiempo fuera, puedes entrar en su anillo. Tu propia nave también se construye aquí.
