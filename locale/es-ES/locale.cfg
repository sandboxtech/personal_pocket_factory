console-label=consola del servidor
help-title=Cómo se juega
help-body=[font=default-bold]Tu anillo[/font]\nUno por jugador, solo tú puedes entrar. [color=acid]No se borra con los planetas[/color] y sigue siendo tuyo mientras te pases de vez en cuando: solo una ausencia larga te lo quita. No contiene [color=red]ningún mineral[/color] y en su centro hay un pequeño estanque poco profundo, con sitio para bombas costeras en las cuatro orillas.\nAquí [color=acid]siempre es de día[/color], así que los paneles solares aguantan la noche sin acumuladores.\n\n[font=default-bold]Cuando mueres[/font]\nCaigas donde caigas, reapareces en tu propio anillo. [color=red]El cadáver y todo lo que llevabas se quedan donde moriste[/color] y desaparecen cuando ese planeta se reinicia.\nEl equipo se entrega [color=yellow]como mucho una vez cada __2__ h[/color] (armadura modular, robopuerto personal, paneles solares, robots de construcción): morir dos veces seguidas no te dará un segundo juego.\n\n[font=default-bold]Doce clases de experiencia[/font]\nLos 12 frascos se cuentan por separado. Un frasco aporta tantos niveles como [color=yellow]cifras[/color] tenga su experiencia, y los 12 suman tu nivel total.\nAnchura del anillo = (nivel total + 4) x 16 casillas. Anchura de la nave = (nivel total + 4) x 16 casillas.\n\n[font=default-bold]Cofres enlazados[/font]\nUn cofre de madera fabricado a mano sale directamente como [color=acid]cofre enlazado[/color]. Colocado fuera de tu anillo se convierte en punto de entrega, y su contenido va directo a los cofres de recepción del anillo.\n[color=red]Como mucho __1__ a la vez[/color] en todo el universo: al poner uno de más, el más antiguo vuelve a tu inventario.\nLos cofres [color=red]no se abren a mano[/color]; todo entra y sale con brazos mecánicos.\n\n[font=default-bold]Mundos públicos[/font]\n[color=acid][planet=nauvis] [planet=vulcanus] [planet=gleba] [planet=fulgora] [planet=aquilo][/color] tienen cada uno su propio ciclo de reinicio. Al cumplirse, el planeta entero se [color=red]borra[/color].\nSi sigues abajo recibirás un aviso antes: esa es la señal para llenar un punto de entrega y salir.
help-body-veteran=[font=default-bold]Energía y conversión[/font]\nLa energía se recupera a 1 por segundo, también desconectado, y se detiene en el tope. 1 de energía convierte 1 frasco.\nLa conversión manual está en «Mi anillo» y usa tu inventario; la automática usa los cofres de recepción, cada __1__ min mientras estás conectado y cada __2__ min mientras no lo estás. Ambas gastan la misma reserva.\n\n[font=default-bold]Fuga tecnológica[/font]\nLas tecnologías investigadas se anulan periódicamente; la probabilidad sube con el número de clases de frascos que exige la tecnología. Las investigaciones por niveles bajan un nivel en vez de ponerse a cero.\n\n[font=default-bold]Ausencia prolongada[/font]\nSi no te conectas durante bastante tiempo, tu anillo pasa a ser público y cualquiera puede entrar y desmontarlo; más tiempo aún y se retira. La experiencia no se ve afectada.
help-body-detail=[font=default-bold]Las cifras exactas[/font]\nCiclos de reinicio: [planet=nauvis] __1__ min, [planet=vulcanus] __2__ min, [planet=gleba] __3__ min, [planet=fulgora] __4__ min, [planet=aquilo] __5__ min.\nCada ronda se sortea un coeficiente entre 0 y __6__; la probabilidad de que una tecnología se anule esa ronda, en porcentaje, es su número de clases de frascos × ese coeficiente.\nTras __7__ h desconectado tu anillo se hace público y queda abierto a todos; tras __8__ h se retira, aunque la experiencia nunca se pierde. Ambos umbrales crecen con tu tiempo de juego total; las cifras de arriba son el tope de veterano. Para un jugador nuevo son como mínimo __9__ h hasta hacerse público y __10__ h hasta el borrado.\nAvisos antes del borrado: __11__ min antes.
btn-overview-tip=[font=default-bold]Servidor[/font]\nLos anillos y las naves de todo el mundo.\nCuando alguien lleva bastante tiempo fuera, puedes entrar en su anillo. Tu propia nave también se construye aquí.
