ship-scuttled=[color=yellow]__1__[/color] ha desguazado su propia nave
overview-scuttle=Desguazar nave
overview-scuttle-tip=Destruye tu propia nave.\n[color=red]Todo lo que lleve a bordo desaparece con ella, y no se puede deshacer.[/color]\nSolo puedes tener una nave a la vez, así que desguazarla es lo que deja sitio para otra.\nUn primer clic arma el botón y el segundo lo ejecuta.
overview-scuttle-confirm=[color=red]Confirmar desguace[/color]
overview-scuttle-confirm-tip=[color=red]Otro clic destruye esta nave de inmediato.[/color]\nTodo lo que lleve a bordo desaparece con ella.\n¿Te lo has pensado mejor? Espera diez segundos y el botón vuelve a la normalidad.
cfg-ring-pond-half=Radio en casillas del estanque poco profundo del centro del anillo; 0 significa sin estanque
cfg-ring-always-day=Si los anillos tienen día permanente. Activado, los paneles solares dan potencia máxima a todas horas y no hacen falta acumuladores
cfg-world-resource-boost=Public-world ore multipliers: Nauvis size/frequency x2; all planets richness x1/16
ring-deleted-by-admin=[color=red]El administrador __1__ ha borrado tu anillo[/color]. Tu experiencia está intacta: pulsa el botón del anillo y volverá a crecer con la misma anchura.
cfg-ring-length-bonus=Free levels. Length = length_per_level x (total level + this); default is 16 x (level + 4)
cfg-ship-width-per-level=Casillas que gana la nave por nivel
cfg-ship-width-bonus=Niveles regalados a la nave. Anchura = por nivel x (nivel + este valor), es decir 16 x (4 + nivel)
travel-convert-rate=[color=acid]Los frascos de los cofres de recepción se convierten solos cada __1__ min[/color] y gastan la misma energía que la conversión manual. Saca antes de la siguiente pasada lo que quieras para investigar.
