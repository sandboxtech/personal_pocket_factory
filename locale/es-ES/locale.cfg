description=\n[color=acid]Proyecto Anillo de Dyson[/color]\n\n[img=virtual-signal/signal-info] [font=default-large-bold]Tu anillo[/font]\nCada jugador tiene su [color=acid]anillo propio[/color]: solo tú puedes entrar, pero [color=red]no hay ni un recurso[/color].\nAcumula experiencia y el anillo se ensancha.\n\n[img=item/linked-chest] [font=default-large-bold]Cofres enlazados[/font]\nUn cofre de madera fabricado a mano ya es un [color=acid]cofre enlazado[/color]. Colócalo fuera como punto de entrega y todo lo que metas irá directo a los cofres de recepción de tu anillo.\nYa no hace falta cargar el mineral: lo meten los [color=yellow]brazos mecánicos[/color].\n\n[img=space-location/nauvis] [font=default-large-bold]Los mundos exteriores se reinician[/font]\nLos cinco planetas se reinician por turnos: cuando llega la hora [color=red]desaparece todo[/color], y el servidor [color=red]pierde tecnologías investigadas al azar[/color].\nSolo quien sigue produciendo e investigando conserva sus tecnologías.\n\n[img=virtual-signal/signal-battery-mid-level] [font=default-large-bold]Ausencia prolongada[/font]\nTu anillo pasa primero a ser [color=acid]público[/color] y queda abierto a todos, y si tardas más aún acaba retirándose.\nPero tu [color=acid]experiencia no se pierde[/color]: al volver, el anillo crece con la misma anchura.\n\n\nVersión 0.2.0\nProyecto https://github.com/sandboxtech/personal_pocket_factory\nGrupo QQ 293280221
